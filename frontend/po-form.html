<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Purchase Order</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <p><a href="index.html">&larr; Home</a> | <a href="po-list.html">All POs</a></p>
  <h1 id="pageTitle">Create Purchase Order</h1>
  <p class="oxi-page-sub" id="pageSub">Pick a supplier, add the items and rates, and save.</p>
  <p id="message"></p>

  <form id="poForm">
    <p>
      <label>Supplier<br>
        <select id="supplier" required><option value="">Loading...</option></select>
      </label>
      <a href="suppliers.html?add=1" id="addSupplier" hidden style="margin-left:10px">+ Add a new supplier</a>
    </p>
    <p>
      <label>Delivery date<br><input type="date" id="delivery"></label>
    </p>
    <p>
      <label>Tax<br><select id="taxType">
        <option value="">Automatic (from the supplier's GST number)</option>
        <option value="intra">Same state: CGST + SGST</option>
        <option value="inter">Other state: IGST</option>
      </select></label>
      <small id="taxNote"></small>
    </p>

    <h3>Items</h3>
    <table id="items">
      <thead>
        <tr><th>Item name</th><th>Qty</th><th>Unit</th><th>Rate (₹)</th><th>GST %</th><th>Amount (₹)</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p><button type="button" id="addRow">+ Add item</button></p>

    <table style="width:auto">
      <tr><td>Subtotal</td><td id="subtotal" align="right">0.00</td></tr>
      <tr class="tx-intra"><td id="cgstLabel">CGST 9%</td><td id="cgst" align="right">0.00</td></tr>
      <tr class="tx-intra"><td id="sgstLabel">SGST 9%</td><td id="sgst" align="right">0.00</td></tr>
      <tr class="tx-inter" hidden><td id="igstLabel">IGST 18%</td><td id="igst" align="right">0.00</td></tr>
      <tr><td><b>TOTAL</b></td><td id="total" align="right"><b>0.00</b></td></tr>
    </table>

    <p><label>Notes<br><textarea id="notes" rows="2" cols="50"></textarea></label></p>
    <p><button type="submit" id="saveBtn">Save PO</button></p>
  </form>
  <script src="common.js"></script>
  <script src="material-picker.js"></script>

  <script>
    // money() / show() come from common.js.
    const tbody = document.querySelector('#items tbody');

    // Fill the supplier dropdown from the server.
    fetch('/api/suppliers').then(r => r.json()).then(d => {
      const sel = document.getElementById('supplier');
      sel.innerHTML = '<option value="">-- Select supplier --</option>';
      d.suppliers.forEach(s => {
        const o = document.createElement('option');
        o.value = s.id; o.textContent = s.name;
        sel.appendChild(o);
      });
    }).catch(() => show('Could not load suppliers. Is the server running?', false));

    // Purchase and the Manager can add a supplier that is not in the list yet
    api('/api/workspace/me').then(me => { if (me.success && (me.is_admin || (me.permissions || []).includes('suppliers.manage'))) document.getElementById('addSupplier').hidden = false; });

    // Adds one empty item row to the table.
    function addRow() {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input class="name" size="28" aria-label="Item name: type to search raw materials"></td>' +
        '<td><input class="qty" type="number" min="0" step="any" style="width:80px"></td>' +
        '<td><select class="unit"><option>Litre</option><option>Kg</option><option>Nos</option><option>Box</option><option>Drum</option></select></td>' +
        '<td><input class="rate" type="number" min="0" step="any" style="width:90px"></td>' +
        '<td><select class="gst" title="GST rate of this item"><option value="">18 (default)</option><option>0</option><option>5</option><option>12</option><option>18</option><option>28</option></select></td>' +
        '<td class="amt" align="right">0.00</td>' +
        '<td><button type="button" class="del">X</button></td>';
      tbody.appendChild(tr);
      tr.querySelector('.del').onclick = () => { if (tbody.rows.length > 1) { tr.remove(); recalc(); } };
      tr.querySelectorAll('input').forEach(i => i.addEventListener('input', recalc)); tr.querySelector('.gst').addEventListener('change', recalc);
      // type a few letters and choose the raw material: its unit is filled in when the list has one (you can still change it)
      oxiMaterialPicker(tr.querySelector('.name'), { onPick: (m) => { const u = tr.querySelector('.unit'); if (m.unit && [...u.options].some(o => o.value === m.unit || o.text === m.unit)) u.value = m.unit; if (m.gst_rate !== null && m.gst_rate !== undefined) { const g = tr.querySelector('.gst'); if ([...g.options].some(o => o.value === String(m.gst_rate))) { g.value = String(m.gst_rate); recalc(); } } tr.querySelector('.qty').focus(); } });
    }

    // Which GST applies comes from the server (the supplier's GST number against ours), so the screen and the saved order agree.
    let tax = { mode: 'intra', cgst_rate: 9, sgst_rate: 9, igst_rate: 18 };
    async function loadTax() {
      const sid = document.getElementById('supplier').value, note = document.getElementById('taxNote');
      if (!sid) { tax = { mode: 'intra', cgst_rate: 9, sgst_rate: 9, igst_rate: 18 }; note.textContent = ''; return recalc(); }
      const d = await api('/api/po/tax-mode?supplier_id=' + encodeURIComponent(sid) + (document.getElementById('taxType').value ? '&tax_type=' + document.getElementById('taxType').value : ''));
      if (d.success) { tax = d; note.textContent = d.mode === 'inter' ? ' IGST applies (supplier is in another state).' : (d.has_gst_number ? ' CGST + SGST apply (supplier is in our state).' : ' This supplier has no GST number saved, so CGST + SGST are assumed. Choose the tax above if that is wrong.'); }
      recalc();
    }
    document.getElementById('supplier').addEventListener('change', loadTax); document.getElementById('taxType').addEventListener('change', loadTax);

    // Updates line amounts and totals on screen (the server recalculates on save).
    function recalc() {
      let subtotal = 0; const byRate = new Map();   // taxable value per GST rate: tax is worked out per rate, as on a GST invoice
      [...tbody.rows].forEach(tr => {
        const amt = (Number(tr.querySelector('.qty').value) || 0) * (Number(tr.querySelector('.rate').value) || 0);
        tr.querySelector('.amt').textContent = money(amt);
        subtotal += Math.round(amt * 100) / 100;
        const r = tr.querySelector('.gst').value === '' ? 18 : Number(tr.querySelector('.gst').value);
        byRate.set(r, (byRate.get(r) || 0) + Math.round(amt * 100) / 100);
      });
      const r2 = (n) => Math.round(n * 100) / 100;
      const inter = tax.mode === 'inter';
      let cgst = 0, sgst = 0, igst = 0;
      byRate.forEach((base, r) => { if (inter) igst += r2(base * r / 100); else { cgst += r2(base * r / 200); sgst += r2(base * r / 200); } });
      document.querySelectorAll('.tx-intra').forEach(r => { r.hidden = inter; }); document.querySelectorAll('.tx-inter').forEach(r => { r.hidden = !inter; });
      document.getElementById('cgstLabel').textContent = 'CGST'; document.getElementById('sgstLabel').textContent = 'SGST'; document.getElementById('igstLabel').textContent = 'IGST';
      document.getElementById('subtotal').textContent = money(subtotal);
      document.getElementById('cgst').textContent = money(cgst);
      document.getElementById('sgst').textContent = money(sgst);
      document.getElementById('igst').textContent = money(igst);
      document.getElementById('total').innerHTML = '<b>' + money(subtotal + cgst + sgst + igst) + '</b>';
    }

    document.getElementById('addRow').onclick = addRow;
    // po-form.html?edit=ID changes an existing order (allowed until a payment or goods receipt exists)
    const editId = new URLSearchParams(location.search).get('edit');
    addRow();
    if (editId) {
      document.getElementById('pageTitle').textContent = 'Edit Purchase Order';
      document.getElementById('saveBtn').textContent = 'Save changes';
      Promise.all([api('/api/po/' + encodeURIComponent(editId)), fetch('/api/suppliers').then(r => r.json())]).then(([d]) => {
        if (!d.success) return show(d.error || 'Could not load the order', false);
        document.getElementById('pageSub').textContent = d.po.po_number + ': change anything, then save. Totals are recalculated.';
        const fill = () => {
          const sel = document.getElementById('supplier');
          if (![...sel.options].some(o => o.value == d.po.supplier_id)) { const o = document.createElement('option'); o.value = d.po.supplier_id; o.textContent = d.po.supplier_name; sel.appendChild(o); }
          sel.value = d.po.supplier_id; loadTax();
        };
        const wait = setInterval(() => { if (document.getElementById('supplier').options.length > 1) { clearInterval(wait); fill(); } }, 100); setTimeout(() => clearInterval(wait), 5000);
        document.getElementById('delivery').value = d.po.delivery_date ? String(d.po.delivery_date).slice(0, 10) : '';
        document.getElementById('notes').value = d.po.notes || '';
        tbody.innerHTML = '';
        d.items.forEach(it => { addRow(); const tr = tbody.lastElementChild; tr.querySelector('.name').value = it.item_name; tr.querySelector('.qty').value = it.quantity; tr.querySelector('.rate').value = it.rate; { const g = tr.querySelector('.gst'); if (it.gst_rate !== null && it.gst_rate !== undefined) { const v = String(Number(it.gst_rate)); if (![...g.options].some(o => o.value === v)) { const o = document.createElement('option'); o.textContent = v; g.appendChild(o); } g.value = v; } }
          const u = tr.querySelector('.unit'); if (![...u.options].some(o => o.value === it.unit)) { const o = document.createElement('option'); o.textContent = it.unit; u.appendChild(o); } u.value = it.unit; });
        recalc();
      });
    }

    // Send the form to the server.
    document.getElementById('poForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const items = [...tbody.rows].map(tr => ({
        item_name: tr.querySelector('.name').value,
        material_id: tr.querySelector('.name').dataset.materialId || undefined,
        quantity: tr.querySelector('.qty').value,
        unit: tr.querySelector('.unit').value,
        rate: tr.querySelector('.rate').value,
        gst_rate: tr.querySelector('.gst').value || undefined
      }));
      const body = {
        supplier_id: document.getElementById('supplier').value,
        tax_type: document.getElementById('taxType').value || undefined,
        delivery_date: document.getElementById('delivery').value,
        notes: document.getElementById('notes').value,
        items
      };
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      try {
        const r = await fetch(editId ? '/api/po/' + encodeURIComponent(editId) : '/api/po/create', {
          method: editId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const d = await r.json();
        if (d.success && editId) {
          location.href = 'po-detail.html?id=' + encodeURIComponent(editId);
        } else if (d.success) {
          show('PO saved: ' + d.po_number + '  |  Total ₹' + money(d.total_amount), true);
          document.getElementById('poForm').reset();
          tbody.innerHTML = ''; addRow(); recalc();
        } else {
          show('Error: ' + d.error, false);
        }
      } catch (err) {
        show('Could not reach the server. Is it running?', false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
