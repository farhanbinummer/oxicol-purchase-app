<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <p><a href="index.html">&larr; Home</a></p>
  <h1>My Account</h1>
  <p class="oxi-page-sub">Your profile and password.</p>
  <p id="message"></p>

  <table style="width:auto" id="whoBox"></table>

  <div id="wsPref" hidden>
    <h3>Default workspace</h3>
    <form id="wsForm">
      <p><label>Open this workspace when I sign in<br><select id="defaultWs"></select></label></p>
      <p><button type="submit">Save default</button></p>
    </form>
  </div>

  <h3>Change password</h3>
  <form id="pwForm">
    <p><label>Current password<br><input id="current" type="password" required></label></p>
    <p><label>New password<br><input id="next" type="password" required minlength="4"></label></p>
    <p><label>Confirm new password<br><input id="confirm" type="password" required minlength="4"></label></p>
    <p><button type="submit" id="saveBtn">Change password</button></p>
  </form>

  <script src="common.js"></script>
  <script>
    let user = null;
    try { user = JSON.parse(localStorage.getItem('oxicol_user') || 'null'); } catch (e) {}
    if (user) {
      const t = document.getElementById('whoBox');
      const LABELS = { rd: 'R&D', admin: 'Administrator', manager: 'Manager', purchase: 'Purchase', accounts: 'Accounts', store: 'Stores', qc: 'Quality check', production: 'Production', branch: 'Branch staff' };
      [['Name', user.name], ['Username', user.username], ['Roles', (user.roles || [user.role]).map(r => LABELS[r] || r).join(', ')]]
        .forEach(([k, v]) => { const tr = document.createElement('tr'); addCell(tr, k); addCell(tr, v); t.appendChild(tr); });
    }
    // Branches and the default workspace come from the server.
    api('/api/workspace/me').then(me => {
      if (!me.success) return;
      const t = document.getElementById('whoBox');
      const tr = document.createElement('tr'); addCell(tr, 'Branches'); addCell(tr, me.scope.branches === null ? 'All branches' : (me.scope.branches.join(', ') || '-')); t.appendChild(tr);
      if (me.workspaces.length > 1) {
        document.getElementById('wsPref').hidden = false;
        const sel = document.getElementById('defaultWs');
        const none = document.createElement('option'); none.value = ''; none.textContent = 'No default (use the last one I worked in)'; sel.appendChild(none);
        me.workspaces.forEach(w => { const o = document.createElement('option'); o.value = w.id; o.textContent = w.title; if (w.id === me.default) o.selected = true; sel.appendChild(o); });
      }
    });
    document.getElementById('wsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const d = await api('/api/workspace/preference', 'PUT', { default: document.getElementById('defaultWs').value || null });
      if (d.success) show('Default workspace saved. You will land there when you sign in.', true); else show(d.error, false);
    });

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const next = document.getElementById('next').value;
      const confirm_ = document.getElementById('confirm').value;
      if (next !== confirm_) { show('New password and confirmation do not match', false); return; }
      const btn = document.getElementById('saveBtn'); btn.disabled = true;
      const d = await api('/api/auth/change-password', 'POST', {
        current_password: document.getElementById('current').value,
        new_password: next
      });
      btn.disabled = false;
      if (d.success) { show('Password changed', true); document.getElementById('pwForm').reset(); }
      else show(d.error, false);
    });
  </script>
</body>
</html>
