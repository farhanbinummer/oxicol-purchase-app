<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Oxicol Purchase Management System</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <div class="oxi-page-head">
    <div class="oxi-page-head-row">
      <div class="oxi-page-titles">
        <h1 id="wsTitle">Dashboard</h1>
        <p class="oxi-page-sub" id="wsSub">Loading your workspace...</p>
      </div>
      <div class="oxi-page-actions" id="wsActions"></div>
    </div>
  </div>
  <p id="message"></p>

  <div id="controls" class="oxi-controls" hidden></div>
  <div class="oxi-metrics" id="cards" aria-busy="true"></div>
  <section id="extraBox" hidden aria-labelledby="extraTitle">
    <h2 class="oxi-band-title" id="extraTitle">R&amp;D projects</h2>
    <div class="oxi-metrics" id="extraCards"></div>
  </section>

  <section class="oxi-section" aria-labelledby="queueTitle">
    <h2 id="queueTitle">My work <span class="oxi-count-pill" id="queueCount" hidden></span></h2>
    <p class="oxi-section-sub">Most urgent first: overdue, then by due date, then by how long it has waited.</p>
    <div id="queue" class="oxi-tasks"></div>
  </section>

  <section class="oxi-section" id="exceptionsBox" aria-labelledby="exTitle" hidden>
    <h2 id="exTitle">Needs attention <span class="oxi-count-pill" id="exCount" hidden></span></h2>
    <div id="exceptions" class="oxi-tasks"></div>
  </section>

  <section class="oxi-section" id="notesBox" aria-labelledby="notesTitle" hidden>
    <h2 id="notesTitle">Connections</h2>
    <div id="notes" class="oxi-notes"></div>
  </section>

  <section class="oxi-section" id="activityBox" aria-labelledby="actTitle" hidden>
    <h2 id="actTitle">Recent activity</h2>
    <div id="activity" class="oxi-activity"></div>
  </section>

  <script src="common.js"></script>
  <script>
    // Everything shown here is built by the server for this person's active workspace: the same permission, branch
    // and field rules as every other screen. Text goes in with textContent, so data can never inject markup.
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const fmtDay = (d) => { if (!d) return null; const p = String(d).slice(0, 10).split('-'); return p[2] + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(p[1]) - 1] + ' ' + p[0]; };

    function taskRow(t) {
      const row = el('div', 'oxi-task oxi-tone-' + (t.tone || 'info')); row.setAttribute('role', 'listitem');
      const main = el('div', 'oxi-task-main');
      const head = el('div', 'oxi-task-head');
      head.append(el('span', 'oxi-task-type', t.type));
      const link = el('a', 'oxi-task-number', t.number); link.href = t.href;
      head.appendChild(link);
      if (t.party) head.append(el('span', 'oxi-task-party', t.party));
      main.append(head, el('p', 'oxi-task-reason', t.reason));

      const facts = el('dl', 'oxi-task-facts');
      const fact = (k, v, cls) => { if (v == null || v === '') return; const w = el('div'); w.append(el('dt', null, k), el('dd', cls, v)); facts.appendChild(w); };
      fact('Progress', t.progress);
      fact('Responsible', t.responsible);
      fact('Due', t.due ? fmtDay(t.due) + (t.overdue ? ' (overdue)' : '') : null, t.overdue ? 'oxi-late' : null);
      fact('Waiting', t.waiting_days == null ? null : (t.waiting_days === 0 ? 'Since today' : t.waiting_days + (t.waiting_days === 1 ? ' day' : ' days')));
      main.appendChild(facts);

      const side = el('div', 'oxi-task-side');
      if (t.next && t.next.href) { const a = el('a', 'oxi-btn', t.next.label); a.href = t.next.href; side.appendChild(a); }
      else if (t.waiting_on) side.appendChild(el('span', 'oxi-task-wait', t.waiting_on));
      row.append(main, side);
      return row;
    }

    function fillList(box, list, emptyText) {
      box.innerHTML = '';
      box.setAttribute('role', 'list');
      if (!list.items.length) { box.appendChild(el('p', 'oxi-empty-line', emptyText)); return; }
      list.items.forEach(t => box.appendChild(taskRow(t)));
      if (list.total > list.items.length) box.appendChild(el('p', 'oxi-more', 'Showing the ' + list.items.length + ' most urgent of ' + list.total + '.'));
    }

    function showError(text) {
      $('cards').innerHTML = ''; $('cards').setAttribute('aria-busy', 'false');
      $('queue').innerHTML = '';
      const box = el('div', 'oxi-error-state'); box.setAttribute('role', 'alert');
      box.append(el('p', null, text));
      const retry = el('button', null, 'Try again'); retry.type = 'button'; retry.onclick = () => load().catch(() => showError('Could not reach the server.'));
      box.appendChild(retry);
      $('queue').appendChild(box);
    }

    function skeleton() {
      const cards = $('cards'); cards.innerHTML = ''; cards.setAttribute('aria-busy', 'true');
      for (let i = 0; i < 3; i++) { const s = el('div', 'oxi-metric oxi-skeleton'); s.style.height = '88px'; cards.appendChild(s); }
      $('queue').innerHTML = ''; $('queue').appendChild(skeletonBlock(72)); $('queue').appendChild(skeletonBlock(72));
    }

    async function load() {
      skeleton();
      const me = await api('/api/workspace/me');
      if (!me.success) { showError(me.error || 'Could not load your workspace.'); return; }
      if (!me.active) {
        $('wsTitle').textContent = 'No workspace assigned';
        $('wsSub').textContent = 'Your account has no role that opens a workspace. Ask an administrator to assign one.';
        $('cards').innerHTML = ''; $('cards').setAttribute('aria-busy', 'false'); $('queue').innerHTML = ''; return;
      }
      const sel = $('controls').querySelector('select');
      const period = sel ? sel.value : '';
      const d = await api('/api/workspace/' + me.active + '/dashboard' + (period ? '?period=' + encodeURIComponent(period) : ''));
      if (!d.success) { showError(d.error || 'Could not load this dashboard.'); return; }

      const first = (me.user.name || '').split(' ')[0];
      $('wsTitle').textContent = d.workspace.title;
      $('wsSub').textContent = (first ? first + ', ' : '') + d.workspace.description.charAt(0).toLowerCase() + d.workspace.description.slice(1);
      document.title = d.workspace.title + ' - Oxicol';

      const actions = $('wsActions'); actions.innerHTML = '';
      d.actions.forEach((a, i) => { const b = el('a', 'oxi-btn' + (i === 0 ? '' : ' oxi-btn-secondary'), a.label); b.href = a.href; actions.appendChild(b); });

      // controls (for example the period for purchase spending)
      const ctl = $('controls'); ctl.innerHTML = '';
      d.controls.forEach(c => {
        const label = el('label', null, c.label + ' '); const s2 = el('select'); s2.id = 'ctl-' + c.name;
        c.options.forEach(o => { const op = el('option', null, o.label); op.value = o.value; if (o.value === c.value) op.selected = true; s2.appendChild(op); });
        s2.onchange = () => load().catch(() => showError('Could not reach the server.'));
        label.appendChild(s2); ctl.appendChild(label);
      });
      ctl.hidden = d.controls.length === 0;

      const cards = $('cards'); cards.innerHTML = ''; cards.setAttribute('aria-busy', 'false');
      if (!d.cards.length) cards.appendChild(el('p', 'oxi-empty-line', 'There is nothing to summarise for your account yet.'));
      d.cards.forEach(c => {
        const a = el('a', 'oxi-metric oxi-tone-' + c.tone); a.href = c.href;
        a.append(el('span', 'oxi-metric-label', c.label), el('span', 'oxi-metric-value', String(c.value)));
        if (c.hint) a.appendChild(el('span', 'oxi-metric-hint', c.hint));
        cards.appendChild(a);
      });

      const ex = $('extraCards'); ex.innerHTML = '';
      (d.extra_cards || []).forEach(c => {
        const a = el('a', 'oxi-metric oxi-tone-' + c.tone); a.href = c.href;
        a.append(el('span', 'oxi-metric-label', c.label), el('span', 'oxi-metric-value', String(c.value)));
        if (c.hint) a.appendChild(el('span', 'oxi-metric-hint', c.hint));
        ex.appendChild(a);
      });
      $('extraBox').hidden = !(d.extra_cards && d.extra_cards.length);

      $('queueCount').hidden = d.queue.total === 0; $('queueCount').textContent = d.queue.total;
      fillList($('queue'), d.queue, 'Nothing is waiting for you. New work appears here as soon as it is ready.');

      $('exceptionsBox').hidden = d.exceptions.total === 0;
      $('exCount').hidden = d.exceptions.total === 0; $('exCount').textContent = d.exceptions.total;
      fillList($('exceptions'), d.exceptions, '');

      const nb = $('notes'); nb.innerHTML = '';
      d.notes.forEach(n => { const w = el('div', 'oxi-note'); w.append(el('b', null, n.label), el('span', 'badge badge-pending', n.state), el('p', null, n.detail)); nb.appendChild(w); });
      $('notesBox').hidden = d.notes.length === 0;

      const act = $('activity'); act.innerHTML = '';
      d.activity.forEach(a => {
        const li = el('a', 'oxi-activity-row'); li.href = a.href;
        li.append(el('span', 'oxi-activity-type', a.type), el('b', null, a.reference), el('span', 'oxi-activity-party', a.party || ''), el('span', 'oxi-activity-status', a.status));
        if (a.amount != null) li.appendChild(el('span', 'oxi-activity-amount', '₹' + money(a.amount)));
        li.appendChild(el('span', 'oxi-activity-when', timeAgo(a.at)));
        act.appendChild(li);
      });
      $('activityBox').hidden = d.activity.length === 0;
    }
    load().catch(() => showError('Could not reach the server.'));
  </script>
</body>
</html>
