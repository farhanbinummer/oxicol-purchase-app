<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Away and cover</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    .cv-card { margin: 0 0 var(--s4); } .cv-card > h2 { margin: 0 0 4px; font-size: 20px; }
    .cv-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .cv-form label { display: block; }
    .cv-form textarea { width: 100%; } .cv-form select, .cv-form input[type=date], .cv-form input[type=text] { width: 100%; max-width: 100%; }
    .cv-hint { margin: 4px 0 0; font-size: 13px; color: var(--text-2); } .cv-hint.warn { color: var(--warn); font-weight: 600; }
    .cv-prev { margin: 12px 0 0; padding: 12px 14px; border: 1px dashed var(--border-strong); border-radius: 12px; background: var(--surface-2); }
    .cv-prev h3 { margin: 0 0 6px; font-size: 16px; } .cv-prev ul { margin: 4px 0 0; padding-left: 18px; } .cv-prev li { margin: 2px 0; overflow-wrap: anywhere; }
    .cv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .cv-item { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--border); border-left: 5px solid var(--c, var(--info)); border-radius: 12px; background: var(--surface); }
    .cv-item.warn { --c: var(--warn); } .cv-item.ok { --c: var(--success); } .cv-item.bad { --c: var(--danger); }
    .cv-main { flex: 1 1 280px; min-width: 0; overflow-wrap: anywhere; } .cv-main strong { display: block; } .cv-main small { display: block; color: var(--text-2); margin-top: 2px; }
    .cv-note { margin: 6px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 6px; white-space: pre-wrap; font-size: 14px; }
    .cv-act { display: flex; gap: 8px; flex-wrap: wrap; }
    .cv-chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--text-2); }
    .cv-chip.waiting { background: var(--warn-bg); color: var(--warn); } .cv-chip.confirmed, .cv-chip.active { background: var(--success-bg); color: var(--success); } .cv-chip.declined { background: var(--danger-bg); color: var(--danger); }
    .cv-tl { position: relative; min-width: 640px; padding: 0 0 4px; } .cv-tl-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; min-height: 32px; border-top: 1px solid var(--border); }
    .cv-tl-name { font-size: 13px; padding-right: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .cv-tl-track { position: relative; height: 22px; }
    .cv-bar { position: absolute; top: 2px; height: 18px; border-radius: 6px; background: var(--info); opacity: .85; } .cv-bar.waiting { background: var(--warn); } .cv-bar.active { background: var(--success); }
    .cv-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); } .cv-weeks { display: grid; grid-template-columns: 150px 1fr; font-size: 12px; color: var(--text-2); } .cv-weeks > div:last-child { display: flex; }
    .cv-weeks span { flex: 1; border-left: 1px solid var(--border); padding-left: 4px; }
    @media (max-width: 640px) { .cv-two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <p><a href="index.html">&larr; Home</a> | <a href="my-day.html">My Day</a> | <a href="rd-dashboard.html">R&amp;D Dashboard</a></p>
  <h1>Away and cover</h1>
  <p class="oxi-page-sub">Tell the manager when you will be away. The manager approves it and chooses who will cover. The person chosen is told, and does your work while you are away.</p>
  <p id="message" role="status"></p>
  <div id="page" aria-busy="true"><div class="oxi-skeleton" style="height:96px"></div></div>

  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    let DATA = null, editing = null;
    function note(text, ok) { const m = $('message'); m.textContent = text; m.className = ok ? 'success' : 'error'; if (!ok) m.scrollIntoView({ block: 'nearest' }); }
    const CHIP = { waiting_approval: ['Waiting for the manager', 'waiting'], needs_cover: ['Approved. Cover not chosen yet', 'waiting'], problem: ['Cover reported a problem', 'waiting'], ready: ['Ready', 'confirmed'], active: ['Away now', 'active'], rejected: ['Not approved', 'declined'], finished: ['Finished', ''], ended: ['Ended early', ''] };
    const chip = (st) => { const c = CHIP[st] || [st, '']; return el('span', 'cv-chip ' + c[1], c[0]); };
    const range = (a) => dmy(a.from_date) + ' to ' + dmy(a.to_date);
    /** Is this person away (or already asked to be) on any of these dates? Used to warn before choosing a cover. */
    const clash = (userId, from, to, exceptId) => DATA.team.concat(DATA.mine, DATA.covering).find(a => a.user_id === userId && a.id !== exceptId && !['rejected', 'ended', 'finished'].includes(a.status) && a.from_date <= to && a.to_date >= from);

    /** A small box asking for a reason (used for "Tell the manager there is a problem" and "Do not approve"). */
    function askReason(title, label, okText, onOk) {
      const dlg = el('dialog', 'oxi-dlg'); dlg.setAttribute('aria-labelledby', 'arT'); const f = el('form'); f.method = 'dialog';
      const h = el('h3', null, title); h.id = 'arT'; const l = el('label', null, label); const ta = el('textarea'); ta.rows = 3; ta.maxLength = 1000; ta.id = 'arWhy'; l.htmlFor = 'arWhy';
      const err = el('div', 'oxi-errtext'); err.setAttribute('role', 'alert'); err.hidden = true; const row = el('div', 'row');
      const no = el('button', 'oxi-btn-secondary', 'Cancel'); no.type = 'button'; no.onclick = () => dlg.close(); const ok = el('button', null, okText); ok.type = 'submit'; row.append(no, ok);
      f.append(h, l, ta, err, row); dlg.appendChild(f); document.body.appendChild(dlg); const back = document.activeElement;
      f.onsubmit = async (e) => { e.preventDefault(); if (ta.value.trim().length < 5) { err.textContent = 'Please write a few words (at least 5 letters).'; err.hidden = false; ta.focus(); return; } ok.disabled = true; const r = await onOk(ta.value); if (r === true) dlg.close(); else { ok.disabled = false; err.textContent = r || 'That did not work.'; err.hidden = false; } };
      dlg.addEventListener('close', () => { dlg.remove(); if (back && document.contains(back)) back.focus(); }); dlg.showModal(); ta.focus();
    }
    const person = (list, value, blank, a) => { const s = el('select'); if (blank != null) { const o = el('option', null, blank); o.value = ''; s.appendChild(o); } list.forEach(p => { const c = a ? clash(p.id, a.from_date, a.to_date, a.id) : null; const o = el('option', null, p.name + (c ? ' (away on those dates)' : '')); o.value = p.id; if (c) o.disabled = true; s.appendChild(o); }); s.value = value == null ? '' : String(value); return s; };

    function listItem(a, opts) {
      const li = el('li'); const tone = (a.status === 'problem' || a.status === 'waiting_approval' || a.status === 'needs_cover') ? 'warn' : a.status === 'rejected' ? 'bad' : (a.status === 'active' || a.status === 'ready') ? 'ok' : '';
      const row = el('div', 'cv-item ' + tone); const m = el('div', 'cv-main');
      const t = el('strong'); t.append(document.createTextNode((opts.as === 'cover' ? a.user_name + ' will be away: ' : (opts.as === 'team' || opts.as === 'approve') ? a.user_name + ': ' : '') + a.kind + ', ' + range(a) + '  ')); t.appendChild(chip(a.status)); m.appendChild(t);
      const who = opts.as === 'cover' ? 'The manager chose you to cover.' : a.approval_status === 'pending' ? (a.cover_name ? 'Suggested cover: ' + a.cover_name : 'No cover suggested') : (a.cover_name ? 'Cover: ' + a.cover_name : 'Cover: not chosen yet');
      m.appendChild(el('small', null, who + (a.reason ? ' · ' + a.reason : '') + (a.approval_status === 'approved' && a.approved_by_name ? ' · Approved by ' + a.approved_by_name : '')));
      if (a.approval_status === 'rejected' && a.approval_reason) m.appendChild(el('small', null, 'Not approved: ' + a.approval_reason));
      if (a.cover_problem) { const pb = el('div', 'cv-note'); pb.style.borderLeftColor = 'var(--warn)'; pb.append(el('b', null, (a.cover_name || 'The cover') + ' reports a problem: '), document.createTextNode(a.cover_problem)); m.appendChild(pb); }
      if (a.handover_note) { const n = el('div', 'cv-note'); n.append(el('b', null, 'Notes for the cover: '), document.createTextNode(a.handover_note)); m.appendChild(n); }
      let pick = null;
      if (a.can_approve || a.can_assign) { const l = el('label', null, 'Who will cover'); pick = person(DATA.people.filter(p => p.id !== a.user_id), a.cover_problem ? '' : a.cover_user_id, 'Choose a person', a); pick.id = 'pick' + a.id; l.htmlFor = pick.id; const w = el('div'); w.style.marginTop = '8px'; w.append(l, pick); m.appendChild(w); }
      row.appendChild(m); const act = el('div', 'cv-act');
      if (a.can_approve || a.can_assign) {
        const y = el('button', null, a.can_assign ? 'Choose this person instead' : 'Approve'); y.type = 'button'; y.setAttribute('aria-label', (a.can_assign ? 'Choose the cover for ' : 'Approve the absence of ') + a.user_name + ', ' + range(a));
        y.onclick = async () => { if (!pick.value) { note('Please choose who will cover.', false); pick.focus(); return; } y.disabled = true; const r = a.can_assign ? await api('/api/rd/cover/' + a.id, 'PATCH', { cover_user_id: Number(pick.value) }) : await api('/api/rd/cover/' + a.id + '/approve', 'POST', { approve: true, cover_user_id: Number(pick.value) }); if (!r.success) { y.disabled = false; note(r.error || 'Could not save.', false); return; } note('Done. ' + a.user_name + ' and the person chosen have been told.', true); load(); };
        act.appendChild(y);
        if (a.can_approve) { const n = el('button', 'oxi-btn-secondary', 'Do not approve'); n.type = 'button'; n.setAttribute('aria-label', 'Do not approve the absence of ' + a.user_name);
          n.onclick = () => askReason('Do not approve ' + a.user_name + '\'s absence', 'Why not? (they will be told)', 'Send', async (why) => { const r = await api('/api/rd/cover/' + a.id + '/approve', 'POST', { approve: false, reason: why }); if (!r.success) return r.error; note('Done. ' + a.user_name + ' has been told.', true); load(); return true; }); act.appendChild(n); }
      }
      if (a.can_report) {
        const n = el('button', 'oxi-btn-secondary', 'Tell the manager there is a problem'); n.type = 'button'; n.setAttribute('aria-label', 'Tell the manager there is a problem with covering for ' + a.user_name);
        n.onclick = () => askReason('Problem with covering for ' + a.user_name, 'What is the problem? (the manager will read it and decide)', 'Send', async (why) => { const r = await api('/api/rd/cover/' + a.id + '/problem', 'POST', { note: why }); if (!r.success) return r.error; note('The manager has been told.', true); load(); return true; });
        act.appendChild(n);
      }
      if (a.can_edit && opts.as !== 'cover' && opts.as !== 'approve') {
        const ed = el('button', 'oxi-btn-secondary', 'Change'); ed.type = 'button'; ed.setAttribute('aria-label', 'Change the absence ' + range(a)); ed.onclick = () => { editing = a; renderForm(); $('cvForm').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        const en = el('button', 'oxi-btn-secondary', 'Cancel it'); en.type = 'button'; en.setAttribute('aria-label', 'Cancel the absence ' + range(a));
        en.onclick = async () => { if (!confirm('Cancel this absence? The person covering will no longer be needed.')) return; const r = await api('/api/rd/cover/' + a.id + '/end', 'POST', {}); if (!r.success) { note(r.error || 'Could not cancel it.', false); return; } note('Cancelled.', true); load(); };
        act.append(ed, en);
      } else if (opts.as === 'cover' && false) {
        const en = el('button', 'oxi-btn-secondary', 'Stop covering'); en.type = 'button'; en.onclick = async () => { if (!confirm('Stop covering now?')) return; const r = await api('/api/rd/cover/' + a.id + '/end', 'POST', {}); if (!r.success) { note(r.error || 'Could not end it.', false); return; } load(); }; act.appendChild(en);
      }
      row.appendChild(act); li.appendChild(row); return li;
    }
    function card(id, title, sub) { const c = el('section', 'oxi-card2 cv-card'); c.id = id; c.setAttribute('aria-labelledby', id + 'T'); const h = el('h2', null, title); h.id = id + 'T'; c.appendChild(h); if (sub) c.appendChild(el('p', 'oxi-section-note', sub)); return c; }

    function renderForm() {
      const d = DATA, old = $('cvForm'); const e = editing; const mgr = d.can_approve;
      const c = card('cvForm', e ? 'Change your absence' : 'Tell us you will be away', e ? 'If you change the dates, the manager has to approve again.' : (mgr ? 'Write down an absence. If it is for someone else, choose who will cover.' : 'Fill this in. It goes to the manager, who approves it and chooses who will cover.'));
      const f = el('form', 'cv-form'); f.noValidate = true;
      const fld = (label, ctl, id, hint) => { const w = el('div'); const l = el('label', null, label); ctl.id = id; l.htmlFor = id; w.append(l, ctl); if (hint) w.appendChild(el('p', 'cv-hint', hint)); return w; };
      const sel = (opts, value, blank) => { const s = el('select'); if (blank != null) { const o = el('option', null, blank); o.value = ''; s.appendChild(o); } opts.forEach(([v, t]) => { const o = el('option', null, t); o.value = v; s.appendChild(o); }); s.value = value == null ? '' : String(value); return s; };
      const who = d.can_manage && !e ? sel(d.people.map(p => [p.id, p.name]), '', 'Me') : null;
      const kind = sel(d.kinds.map(k => [k, k]), e ? e.kind : 'Leave'); const from = Object.assign(el('input'), { type: 'date', value: e ? e.from_date : d.today, min: d.today }); const to = Object.assign(el('input'), { type: 'date', value: e ? e.to_date : '', min: d.today });
      if (e && e.from_date <= d.today) from.disabled = true;
      const coverLocked = e && e.approval_status === 'approved' && !mgr;
      const cov = person(d.people.filter(p => !e || p.id !== e.user_id), e ? e.cover_user_id : '', mgr ? 'Choose a person' : 'No suggestion');
      const reason = Object.assign(el('input'), { type: 'text', maxLength: 200, value: e && e.reason ? e.reason : '', placeholder: 'For example: family function, supplier visit' });
      const notes = el('textarea'); notes.rows = 5; notes.maxLength = 3000; notes.value = e && e.handover_note ? e.handover_note : ''; notes.placeholder = 'What is urgent? Who should they call? What must not be forgotten?';
      if (who) f.appendChild(fld('Who is away (leave as "Me" for yourself)', who, 'cvWho'));
      const r1 = el('div', 'cv-two'); r1.append(fld('Type', kind, 'cvKind'), fld('Reason', reason, 'cvWhy')); f.appendChild(r1);
      const r2 = el('div', 'cv-two'); r2.append(fld('From', from, 'cvFrom', e && from.disabled ? 'You are already away, so the first day cannot change.' : 'An absence can be up to ' + d.max_days + ' days.'), fld('To', to, 'cvTo')); f.appendChild(r2);
      const covHint = el('p', 'cv-hint'); covHint.setAttribute('aria-live', 'polite');
      const covWrap = fld(mgr ? 'Who will cover' : 'Who could cover (you may suggest someone)', cov, 'cvCover'); covWrap.appendChild(covHint); if (coverLocked) { cov.disabled = true; covHint.textContent = 'The manager chose who covers. Ask the manager to change it.'; }
      f.appendChild(covWrap);
      f.appendChild(fld('Notes for the person who covers', notes, 'cvNote', 'Only you, the person who covers and the manager can read this.'));
      const prev = el('div', 'cv-prev'); prev.setAttribute('aria-live', 'polite'); prev.hidden = true; f.appendChild(prev);
      const err = el('div', 'oxi-errtext'); err.setAttribute('role', 'alert'); err.hidden = true; f.appendChild(err);
      const row = el('div', 'cv-act'); row.style.marginTop = '12px'; const save = el('button', null, e ? 'Save changes' : (mgr ? 'Save' : 'Send to the manager')); save.type = 'submit'; row.appendChild(save);
      if (e) { const cn = el('button', 'oxi-btn-secondary', 'Cancel'); cn.type = 'button'; cn.onclick = () => { editing = null; renderForm(); }; row.appendChild(cn); }
      f.appendChild(row); c.appendChild(f);
      const checkCover = () => { covHint.className = 'cv-hint'; if (!coverLocked) covHint.textContent = ''; const id = Number(cov.value); if (!id || !from.value || !to.value) return; const cl = clash(id, from.value, to.value, e && e.id); if (cl) { covHint.className = 'cv-hint warn'; covHint.textContent = cl.user_name + ' is away on those dates. Choose someone else.'; } };
      let tok = 0;
      const showPreview = async () => {
        const uid = who && who.value ? who.value : null; if (!to.value) { prev.hidden = true; return; } const my = ++tok;
        const r = await api('/api/rd/cover/preview?to=' + to.value + (uid ? '&user_id=' + uid : (e && e.user_id !== d.me ? '&user_id=' + e.user_id : ''))); if (my !== tok || !r.success) return;
        prev.hidden = false; prev.innerHTML = ''; prev.appendChild(el('h3', null, 'Work that will be waiting while you are away'));
        if (!r.tasks.length && !r.stages.length && !r.reviews) { prev.appendChild(el('p', null, 'Nothing is open for these dates.')); return; }
        if (r.tasks.length) { prev.appendChild(el('div', null, plural(r.tasks.length, 'open task') + ' due by ' + dmy(to.value) + ' or with no date:')); const ul = el('ul'); r.tasks.slice(0, 8).forEach(t => { const li = el('li'); const a = el('a', null, t.title); a.href = 'project.html?id=' + t.project_id + '#list'; li.append(a, document.createTextNode(' (' + t.project_number + (t.due_date ? ', due ' + dmy(t.due_date) : '') + ')')); ul.appendChild(li); }); if (r.tasks.length > 8) ul.appendChild(el('li', null, '...and ' + (r.tasks.length - 8) + ' more')); prev.appendChild(ul); }
        if (r.stages.length) { prev.appendChild(el('div', null, plural(r.stages.length, 'stage') + ' you are in charge of:')); const ul = el('ul'); r.stages.forEach(s => ul.appendChild(el('li', null, s.project_number + ': stage ' + s.stage_no + ' ' + s.stage_name + (s.planned_date ? ', planned ' + dmy(s.planned_date) : '')))); prev.appendChild(ul); }
        if (r.reviews) prev.appendChild(el('div', null, plural(r.reviews, 'piece') + ' of work waiting for you to check.'));
        prev.appendChild(el('p', 'cv-hint', 'The person who covers will see these. Write the important ones in the notes.'));
      };
      [cov, from, to].forEach(x => x.addEventListener('change', checkCover)); [to, who].filter(Boolean).forEach(x => x.addEventListener('change', showPreview)); checkCover(); if (e) showPreview();
      f.addEventListener('submit', async (ev) => {
        ev.preventDefault(); err.hidden = true;
        if (!from.value || !to.value) { err.textContent = 'Please give the first and last day.'; err.hidden = false; (from.value ? to : from).focus(); return; }
        if (mgr && !e && !cov.value && (!who || who.value)) { err.textContent = 'Please choose who will cover.'; err.hidden = false; cov.focus(); return; }
        save.disabled = true;
        const body = { kind: kind.value, from_date: from.value, to_date: to.value, reason: reason.value, handover_note: notes.value }; if (!coverLocked) body.cover_user_id = cov.value ? Number(cov.value) : null;
        if (who && who.value) body.user_id = Number(who.value);
        const r = e ? await api('/api/rd/cover/' + e.id, 'PATCH', body) : await api('/api/rd/cover', 'POST', body);
        save.disabled = false; if (!r.success) { err.textContent = r.error || 'Could not save.'; err.hidden = false; err.scrollIntoView({ block: 'nearest' }); return; }
        const h = r.heads_up; note(e ? 'Saved.' : (r.approval === 'approved' ? 'Saved. The person chosen has been asked if they can cover.' : 'Sent to the manager.') + (!e && h && (h.tasks || h.stages || h.reviews) ? ' While you are away: ' + [h.tasks && plural(h.tasks, 'open task'), h.stages && plural(h.stages, 'stage'), h.reviews && plural(h.reviews, 'piece') + ' of work to check'].filter(Boolean).join(', ') + '.' : ''), true);
        editing = null; load();
      });
      if (old) old.replaceWith(c); else $('page').appendChild(c); return c;
    }

    function timeline(team, today) {
      const wrap = el('div', 'oxi-table-scroll'); wrap.tabIndex = 0; wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', 'Calendar of who is away in the next six weeks'); wrap.setAttribute('aria-hidden', 'true');
      const start = new Date(today + 'T00:00:00Z'), day = 86400000, N = 42, t0 = start.getTime(); const tl = el('div', 'cv-tl');
      const wk = el('div', 'cv-weeks'); wk.append(el('div'), el('div')); for (let w = 0; w < 6; w++) wk.lastChild.appendChild(el('span', null, dmy(new Date(t0 + w * 7 * day).toISOString().slice(0, 10)))); tl.appendChild(wk);
      [...new Set(team.map(a => a.user_name))].forEach(n => {
        const row = el('div', 'cv-tl-row'); row.appendChild(el('div', 'cv-tl-name', n)); const tr = el('div', 'cv-tl-track');
        team.filter(a => a.user_name === n).forEach(a => { const s = Math.max(0, (Date.parse(a.from_date) - t0) / day), e = Math.min(N, (Date.parse(a.to_date) - t0) / day + 1); if (e <= 0 || s >= N) return; const b = el('div', 'cv-bar ' + (a.status === 'active' || a.status === 'ready' ? 'active' : 'waiting')); b.style.left = (s / N * 100) + '%'; b.style.width = Math.max(1.5, (e - s) / N * 100) + '%'; b.title = n + ': ' + range(a) + (a.cover_name ? ' (cover ' + a.cover_name + ')' : ''); tr.appendChild(b); });
        const td = el('div', 'cv-today'); td.style.left = '0%'; tr.appendChild(td); row.appendChild(tr); tl.appendChild(row);
      });
      wrap.appendChild(tl); return wrap;
    }

    function render() {
      const d = DATA, page = $('page'); page.innerHTML = ''; page.setAttribute('aria-busy', 'false');
      if (d.can_approve && d.to_approve.length) { const c = card('cvApprove', 'Waiting for you', 'Choose who will cover, then approve. The person chosen is told straight away and starts on the first day.'); const ul = el('ul', 'cv-list'); d.to_approve.forEach(a => ul.appendChild(listItem(a, { as: 'approve' }))); c.appendChild(ul); page.appendChild(c); }
      const wb = d.welcome_back_summary; if (wb) {
        const c = card('cvBack', 'While you were away', 'What happened ' + range(wb.absence) + '.'); const ul = el('ul'); ul.style.margin = '0'; ul.style.paddingLeft = '18px';
        ul.appendChild(el('li', null, wb.done_for_me.length ? plural(wb.done_for_me.length, 'task') + ' done for you:' : 'No task was done for you.'));
        wb.done_for_me.slice(0, 10).forEach(t => { const li = el('li'); const a = el('a', null, t.title); a.href = 'project.html?id=' + t.project_id + '#list'; li.append(a, document.createTextNode(' (' + t.project_number + (t.by_name ? ', by ' + t.by_name : '') + ')')); ul.appendChild(li); });
        ul.appendChild(el('li', null, plural(wb.new_tasks, 'new task') + ' came in for you.')); ul.appendChild(el('li', null, plural(wb.open_now, 'task') + ' open now.'));
        c.appendChild(ul); const go = el('a', 'oxi-btn', 'Open My Day'); go.href = 'my-day.html'; go.style.marginTop = '10px'; go.style.display = 'inline-block'; c.appendChild(go); page.appendChild(c);
      }
      renderForm();
      const cm = card('cvMine', 'Your absences', 'What you asked for, and where it is now.');
      if (!d.mine.length) cm.appendChild(el('p', 'oxi-section-note', 'Nothing planned.')); else { const ul = el('ul', 'cv-list'); d.mine.forEach(a => ul.appendChild(listItem(a, { as: 'mine' }))); cm.appendChild(ul); } page.appendChild(cm);
      const cov = d.covering; if (cov.length) { const cc = card('cvCov', 'You will cover', 'The manager chose you. Their open tasks, work to check and stages are in My Day while they are away. If there is a problem, tell the manager.'); const ul = el('ul', 'cv-list'); cov.forEach(a => ul.appendChild(listItem(a, { as: 'cover' }))); cc.appendChild(ul); page.appendChild(cc); }
      const ct = card('cvTeam', 'Who is away in the next six weeks', 'Look here before giving out work.');
      if (!d.team.length) ct.appendChild(el('p', 'oxi-section-note', d.can_see_team ? 'Nobody is away.' : 'This list is shown to R&D editors, managers and people who can see all projects.')); else {
        ct.appendChild(timeline(d.team, d.today)); const w = el('div', 'oxi-table-scroll'); const t = el('table'); t.appendChild(el('caption', 'oxi-sr-only', 'Who is away and who covers'));
        t.innerHTML = '<thead><tr><th scope="col">Person</th><th scope="col">Away</th><th scope="col">Type</th><th scope="col">Cover</th><th scope="col">Status</th></tr></thead>'; const tb = el('tbody');
        d.team.forEach(a => { const tr = el('tr'); tr.append(el('td', null, a.user_name), el('td', null, range(a)), el('td', null, a.kind), el('td', null, a.cover_name || '-')); const s = el('td'); s.appendChild(chip(a.status)); tr.appendChild(s); tb.appendChild(tr); }); t.appendChild(tb); w.appendChild(t); ct.appendChild(w); }
      page.appendChild(ct);
    }
    async function load() {
      const [d, s] = await Promise.all([api('/api/rd/cover'), api('/api/rd/cover/summary')]);
      if (!d.success) { $('page').innerHTML = ''; const e = el('div', 'oxi-error-state'); e.setAttribute('role', 'alert'); e.appendChild(el('p', null, d.error || 'Could not load this page.')); $('page').appendChild(e); return; }
      d.me = (() => { try { return JSON.parse(localStorage.getItem('oxicol_user')).id; } catch (e) { return null; } })(); d.can_see_team = d.can_manage || d.team.length > 0;
      d.welcome_back_summary = s.success && s.summary && s.summary.done_for_me !== undefined && (s.summary.done_for_me.length || s.summary.new_tasks) ? s.summary : null;
      DATA = d; render();
    }
    load().catch(() => note('Could not reach the server.', false));
  </script>
