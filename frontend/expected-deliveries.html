<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expected Deliveries</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    /* summary tiles (they are also the filters) */
    .ed-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 var(--s4); }
    .ed-search { position: relative; flex: 1 1 280px; max-width: 520px; } .ed-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-2); pointer-events: none; }
    .ed-search input { width: 100%; padding-left: 38px; border-radius: 999px; }
    .ed-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 var(--s3); }
    .ed-chips button.ed-tile { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 64px; padding: 10px 14px; border-radius: 14px; background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform .12s, border-color .12s, box-shadow .12s; }
    .ed-chips button.ed-tile:hover { transform: translateY(-1px); border-color: var(--tone, var(--accent)); box-shadow: var(--shadow-md); background: var(--surface); }
    .ed-chips button.ed-tile[aria-pressed=true] { border-color: var(--tone, var(--accent)); background: var(--tone-bg, var(--primary-soft)); box-shadow: inset 0 0 0 1px var(--tone, var(--accent)); }
    .ed-tile .ic { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--tone-bg, var(--primary-soft)); color: var(--tone, var(--accent)); } .ed-tile .ic svg { width: 20px; height: 20px; }
    .ed-tile .num { display: block; font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; } .ed-tile .lbl { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 3px; font-weight: 600; }
    .ed-tile.t-all { --tone: var(--accent); --tone-bg: var(--primary-soft); } .ed-tile.t-overdue { --tone: var(--danger); --tone-bg: var(--danger-bg); } .ed-tile.t-today { --tone: var(--warn); --tone-bg: var(--warn-bg); }
    .ed-tile.t-soon { --tone: var(--info); --tone-bg: var(--info-bg); } .ed-tile.t-way { --tone: var(--success); --tone-bg: var(--success-bg); } .ed-tile.t-nodate { --tone: var(--neutral); --tone-bg: var(--neutral-bg); }
    .ed-tile.t-overdue:not([aria-pressed=true]) .num.zero, .ed-tile .num.zero { opacity: .55; }

    /* order cards */
    .ed-card { --tone: var(--info); --tone-bg: var(--info-bg); position: relative; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); margin: 0 0 var(--s4); padding: 18px 20px 14px; box-shadow: var(--shadow-sm); overflow: hidden; transition: box-shadow .15s, border-color .15s; max-width: 1100px; }
    .ed-card::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--tone); opacity: .9; }
    .ed-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .ed-card.late { --tone: var(--danger); --tone-bg: var(--danger-bg); } .ed-card.today { --tone: var(--warn); --tone-bg: var(--warn-bg); } .ed-card.soon { --tone: var(--info); --tone-bg: var(--info-bg); } .ed-card.way { --tone: var(--success); --tone-bg: var(--success-bg); } .ed-card.nodate { --tone: var(--neutral); --tone-bg: var(--neutral-bg); }
    .ed-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 14px; }
    .ed-avatar { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 18px; background: var(--tone-bg); color: var(--tone); }
    .ed-id { display: flex; flex-direction: column; min-width: 0; } .ed-head .po { font-size: 18px; font-weight: 800; letter-spacing: .1px; } .ed-head .sup { color: var(--text-2); font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .ed-head .when { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; background: var(--tone-bg); color: var(--tone); }
    .ed-head .when svg { width: 14px; height: 14px; }

    /* ordered > dispatched > delivered */
    .ed-steps { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 0 0 16px; padding: 0 4px; }
    .ed-step { position: relative; text-align: center; font-size: 12.5px; color: var(--text-2); padding-top: 26px; }
    .ed-step::before { content: ""; position: absolute; top: 8px; left: -50%; right: 50%; height: 3px; background: var(--border-strong); border-radius: 3px; } .ed-step:first-child::before { display: none; }
    .ed-step::after { content: ""; position: absolute; top: 1px; left: 50%; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%; background: var(--surface); border: 3px solid var(--border-strong); box-sizing: border-box; }
    .ed-step b { display: block; font-size: 13px; color: var(--text-2); font-weight: 700; } .ed-step span { display: block; margin-top: 1px; }
    .ed-step.done::before { background: var(--success); } .ed-step.done::after { background: var(--success); border-color: var(--success); } .ed-step.done b { color: var(--text); }
    .ed-step.now::before { background: var(--success); } .ed-step.now::after { border-color: var(--tone); box-shadow: 0 0 0 4px var(--tone-bg); } .ed-step.now b { color: var(--tone); }

    .ed-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 12px; } @media (max-width: 720px) { .ed-grid { grid-template-columns: 1fr; } }
    .ed-box { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--surface-2, transparent); display: flex; flex-direction: column; }
    .ed-box h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-2); font-weight: 700; } .ed-box h3 svg { width: 16px; height: 16px; color: var(--accent); }
    .ed-big { font-size: 19px; font-weight: 800; line-height: 1.25; } .ed-sub { color: var(--text-2); font-size: 14px; margin-top: 3px; }
    .ed-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; margin: 0; } .ed-kv dt { font-size: 12px; color: var(--text-2); } .ed-kv dd { margin: 1px 0 0; font-weight: 700; overflow-wrap: anywhere; }
    .ed-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 12px; } .ed-acts button, .ed-acts a { min-height: 40px; border-radius: 10px; }
    .ed-copied { color: var(--success); font-size: 13px; align-self: center; }
    .ed-items { margin: 12px 0 0; } .ed-items summary { cursor: pointer; font-weight: 600; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--border-strong); list-style: none; display: flex; align-items: center; gap: 8px; }
    .ed-items summary::-webkit-details-marker { display: none; } .ed-items summary::before { content: "\25B8"; color: var(--accent); transition: transform .15s; } .ed-items[open] summary::before { transform: rotate(90deg); }
    .ed-items table { margin-top: 8px; }
    .ed-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .ed-foot .grow { flex: 1; color: var(--text-2); font-size: 13.5px; }
    .ed-warn { color: var(--danger); font-weight: 600; font-size: 14px; }
    @media (max-width: 560px) { .ed-card { padding: 16px 14px 12px; } .ed-head .when { margin-left: 0; } .ed-step { font-size: 11.5px; } }
    @media print { .ed-card { box-shadow: none; break-inside: avoid; } }
  </style>
</head>
<body>
  <p><a href="index.html">&larr; Home</a> | <a href="grn-form.html" id="receiveLink" hidden>+ Receive goods</a></p>
  <h1>Expected Deliveries</h1>
  <p class="oxi-page-sub">Purchase orders still waiting for goods: when each is due, who is bringing it, and how to track it. Prices are never shown here.</p>
  <p id="message" role="status"></p>

  <div class="ed-top">
    <div class="ed-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="edSearch" placeholder="Find by order, supplier, tracking number, vehicle or item" aria-label="Find a delivery by order, supplier, tracking number, vehicle or item" autocomplete="off">
    </div>
  </div>
  <div class="ed-chips" id="whenChips" role="group" aria-label="Show deliveries"></div>
  <p class="oxi-section-sub" id="summary" aria-live="polite"></p>
  <div id="list" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="po-delivery.js"></script>
  <script>
    const ICONS = {
      all: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/>', overdue: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', today: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/><path d="m9 16 2 2 4-4"/>',
      soon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18M8 15h3"/>', way: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/>', nodate: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
      cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>', truck: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
    };
    const icon = (k) => { const w = document.createElement('span'); w.style.display = 'contents'; w.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[k] + '</svg>'; return w.firstChild; };
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const $ = (id) => document.getElementById(id);
    const FILTERS = [['all', 'All waiting'], ['overdue', 'Overdue'], ['today', 'Due today'], ['soon', 'Due in 7 days'], ['way', 'On its way'], ['nodate', 'No date set']];
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let when = new URLSearchParams(location.search).get('when'); if (when === 'dispatched') when = 'way'; if (!FILTERS.some(f => f[0] === when)) when = 'all';
    let ALL = [], term = '', canDate = false, canReceive = false;
    const fmtDay = (d) => { if (!d) return ''; const p = d.split('-'); return DAYS[new Date(d + 'T00:00:00Z').getUTCDay()] + ', ' + Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0]; };
    const shortDay = (d) => { if (!d) return ''; const p = d.split('-'); return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1]; };
    const qty = (n) => Number(n).toLocaleString('en-IN', { maximumFractionDigits: 3 });
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    const sent = (p) => !!(p.transporter || p.tracking_number || p.vehicle_number);
    // days_late comes from the server's own date: above 0 = late, 0 = today, below 0 = still to come
    const kind = (p) => (!p.delivery_date ? 'nodate' : p.days_late > 0 ? 'late' : p.days_late === 0 ? 'today' : p.days_late >= -7 ? 'soon' : 'later');
    const matches = (p, f) => f === 'all' || (f === 'overdue' && kind(p) === 'late') || (f === 'today' && kind(p) === 'today') || (f === 'soon' && ['today', 'soon'].includes(kind(p))) || (f === 'way' && sent(p)) || (f === 'nodate' && !p.delivery_date);
    const hay = (p) => [p.po_number, p.supplier_name, p.transporter, p.tracking_number, p.vehicle_number, ...(p.items || []).map(i => i.item_name)].filter(Boolean).join(' ').toLowerCase();
    function whenText(p) {
      if (!p.delivery_date) return 'No expected date';
      const n = p.days_late; if (n > 0) return plural(n, 'day') + ' late'; if (n === 0) return 'Due today'; if (n === -1) return 'Due tomorrow'; return 'Due in ' + (-n) + ' days';
    }
    const ago = (d) => { if (!d) return ''; const n = Math.round((Date.now() - new Date(d + 'T00:00:00Z').getTime()) / 864e5); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };

    function copy(text, note) {
      const done = () => { note.textContent = 'Copied'; setTimeout(() => { note.textContent = ''; }, 2000); };
      const old = () => { const t = el('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } t.remove(); if (ok) done(); else note.textContent = 'Could not copy: select it and copy by hand'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, old); else old();
    }

    // ordered > dispatched > delivered: where this order is on its way
    function steps(p) {
      const d = sent(p), box = el('div', 'ed-steps'); box.setAttribute('aria-hidden', 'true');
      const st = (cls, t, sub) => { const x = el('div', 'ed-step ' + cls); x.append(el('b', null, t), el('span', null, sub || '')); box.appendChild(x); };
      st('done', 'Ordered', p.po_date ? shortDay(p.po_date) : '');
      st(d ? 'done' : 'now', 'Dispatched', d ? (p.dispatch_date ? shortDay(p.dispatch_date) : 'On its way') : 'Waiting');
      st(d ? 'now' : '', 'Delivery', p.delivery_date ? 'Due ' + shortDay(p.delivery_date) : 'No date yet');
      return box;
    }

    function card(p) {
      const k = kind(p), c = el('article', 'ed-card ' + (k === 'late' ? 'late' : k === 'today' ? 'today' : sent(p) ? 'way' : k === 'nodate' ? 'nodate' : 'soon'));
      c.setAttribute('aria-label', 'Order ' + p.po_number + ', ' + p.supplier_name + ', ' + whenText(p));
      const head = el('div', 'ed-head'); const a = el('a', 'po', p.po_number); a.href = 'po-detail.html?id=' + p.id; const idb = el('div', 'ed-id'); idb.append(a, el('span', 'sup', p.supplier_name)); head.append(el('div', 'ed-avatar', (p.supplier_name || '?').trim().charAt(0).toUpperCase()), idb);
      if (p.earlier_rejected) head.appendChild(el('span', 'badge badge-bad', 'An earlier delivery was rejected'));
      const wp = el('span', 'when'); wp.append(icon('clock'), document.createTextNode(whenText(p))); head.appendChild(wp); c.appendChild(head);
      c.appendChild(steps(p));

      const grid = el('div', 'ed-grid');
      // 1) when it is expected
      const b1 = el('section', 'ed-box'); b1.setAttribute('aria-label', 'Expected delivery'); { const h = el('h3'); h.append(icon('cal'), document.createTextNode('Expected delivery')); b1.appendChild(h); }
      b1.appendChild(el('div', 'ed-big', p.delivery_date ? fmtDay(p.delivery_date) : 'Not set'));
      b1.appendChild(el('div', 'ed-sub', p.delivery_date ? (k === 'late' ? plural(p.days_late, 'day') + ' past the date. Ask the supplier.' : k === 'today' ? 'Expected today' : 'In ' + (-p.days_late) + (p.days_late === -1 ? ' day' : ' days')) : 'Nobody has entered a date yet.'));
      if (canDate) { const acts = el('div', 'ed-acts'); const bt = el('button', 'oxi-btn-secondary', p.delivery_date ? 'Change date' : 'Set date'); bt.type = 'button'; bt.setAttribute('aria-label', (p.delivery_date ? 'Change' : 'Set') + ' the expected date of ' + p.po_number); bt.onclick = () => oxiPoDelivery.dateDialog(p, refresh); acts.appendChild(bt); b1.appendChild(acts); }
      grid.appendChild(b1);

      // 2) who is bringing it and how to follow it
      const b2 = el('section', 'ed-box'); b2.setAttribute('aria-label', 'Dispatch and tracking'); { const h = el('h3'); h.append(icon('truck'), document.createTextNode('Dispatch and tracking')); b2.appendChild(h); }
      if (sent(p)) {
        const dl = el('dl', 'ed-kv'); const kv = (key, val) => { if (!val) return; const w = el('div'); w.append(el('dt', null, key), el('dd', null, val)); dl.appendChild(w); };
        kv('Transporter / courier', p.transporter); kv('Tracking / LR number', p.tracking_number); kv('Vehicle', p.vehicle_number);
        kv('Dispatched', p.dispatch_date ? shortDay(p.dispatch_date) + ' (' + ago(p.dispatch_date) + ')' : ''); b2.appendChild(dl);
        const acts = el('div', 'ed-acts'), note = el('span', 'ed-copied'); note.setAttribute('role', 'status');
        if (p.tracking_url) { const t = el('a', 'oxi-btn', 'Track shipment'); t.href = p.tracking_url; t.target = '_blank'; t.rel = 'noopener noreferrer'; t.setAttribute('aria-label', 'Track shipment ' + (p.tracking_number || p.po_number) + ' (opens in a new tab)'); acts.appendChild(t); }
        if (p.tracking_number) { const cp = el('button', 'oxi-btn-secondary', 'Copy tracking number'); cp.type = 'button'; cp.onclick = () => copy(p.tracking_number, note); acts.appendChild(cp); }
        if (canDate) { const ub = el('button', 'oxi-btn-secondary', 'Update details'); ub.type = 'button'; ub.setAttribute('aria-label', 'Update the dispatch details of ' + p.po_number); ub.onclick = () => oxiPoDelivery.dispatchDialog(p, refresh); acts.appendChild(ub); }
        acts.appendChild(note); b2.appendChild(acts);
      } else {
        b2.appendChild(el('div', 'ed-big', 'Not dispatched yet'));
        b2.appendChild(el('div', 'ed-sub', canDate ? 'Add the transporter, tracking number and vehicle when the supplier sends it.' : 'Purchase will add the transporter and tracking number when the supplier sends it.'));
        if (canDate) { const acts = el('div', 'ed-acts'); const ab = el('button', null, 'Add dispatch details'); ab.type = 'button'; ab.setAttribute('aria-label', 'Add dispatch details for ' + p.po_number); ab.onclick = () => oxiPoDelivery.dispatchDialog(p, refresh); acts.appendChild(ab); b2.appendChild(acts); }
      }
      grid.appendChild(b2); c.appendChild(grid);

      // what is on the order
      const det = el('details', 'ed-items'); det.appendChild(el('summary', null, plural(p.items.length, 'item') + ': ' + p.items.slice(0, 2).map(i => i.item_name + ' ' + qty(i.remaining) + ' ' + i.unit).join(', ') + (p.items.length > 2 ? ' and ' + (p.items.length - 2) + ' more' : '')));
      const t = el('table'); const hr = el('tr'); ['Item', 'Ordered', 'Rejected earlier', 'Still to arrive'].forEach((h, i) => { const th = el('th', i ? 'oxi-num' : null, h); th.scope = 'col'; hr.appendChild(th); }); const hd = el('thead'); hd.appendChild(hr); t.appendChild(hd);
      const tb = el('tbody'); p.items.forEach(i => { const tr = el('tr'); tr.appendChild(el('td', null, i.item_name)); [i.ordered, i.rejected_earlier, i.remaining].forEach(v => tr.appendChild(el('td', 'oxi-num', qty(v) + ' ' + i.unit))); tb.appendChild(tr); }); t.appendChild(tb);
      const w = el('div', 'oxi-table-scroll'); w.appendChild(t); det.appendChild(w); c.appendChild(det);

      const foot = el('div', 'ed-foot'); foot.appendChild(el('span', 'grow', p.po_date ? 'Ordered ' + shortDay(p.po_date) : ''));
      if (canReceive) { const r = el('a', 'oxi-btn', 'Receive goods'); r.href = 'grn-form.html?po=' + p.id; r.setAttribute('aria-label', 'Receive goods for ' + p.po_number); foot.appendChild(r); }
      const o = el('a', 'oxi-btn oxi-btn-secondary', 'Open order'); o.href = 'po-detail.html?id=' + p.id; foot.appendChild(o); c.appendChild(foot);
      return c;
    }

    function paint() {
      const q = term.trim().toLowerCase(), pool = q ? ALL.filter(p => hay(p).includes(q)) : ALL;
      const chips = $('whenChips'); chips.innerHTML = '';
      FILTERS.forEach(([f, label]) => {
        const n = pool.filter(p => matches(p, f)).length, b = el('button', 'ed-tile t-' + f); b.type = 'button'; b.setAttribute('aria-pressed', String(f === when));
        const ic = el('span', 'ic'); ic.appendChild(icon(f)); const tx = el('span'); tx.append(el('span', 'num' + (n ? '' : ' zero'), String(n)), el('span', 'lbl', label)); b.append(ic, tx);
        b.setAttribute('aria-label', label + ': ' + n);
        b.onclick = () => { when = f; history.replaceState(null, '', 'expected-deliveries.html?when=' + f); paint(); }; chips.appendChild(b); });
      const rows = pool.filter(p => matches(p, when)), box = $('list'); box.innerHTML = '';
      const late = ALL.filter(p => kind(p) === 'late').length, today = ALL.filter(p => kind(p) === 'today').length;
      $('summary').textContent = ALL.length ? plural(ALL.length, 'order') + ' waiting for goods' + (late ? ' · ' + late + ' overdue' : '') + (today ? ' · ' + today + ' due today' : '') + (q ? ' · showing ' + rows.length + ' match' + (rows.length === 1 ? '' : 'es') : '') : '';
      if (!rows.length) { box.appendChild(el('p', 'oxi-empty-line', ALL.length ? (q ? 'Nothing matches "' + term + '" here.' : 'No orders in this view.') : 'No orders are waiting. Orders appear here once they are placed and disappear when goods are received.')); return; }
      rows.forEach(p => box.appendChild(card(p)));
    }
    async function load() {
      const box = $('list'); box.innerHTML = ''; box.appendChild(skeletonBlock(120)); box.appendChild(skeletonBlock(120));
      const d = await api('/api/workspace/expected-deliveries?when=all');
      if (!d.success) {
        box.innerHTML = ''; const e = el('div', 'oxi-error-state'); e.setAttribute('role', 'alert'); e.appendChild(el('p', null, d.error || 'Could not load deliveries.'));
        const b = el('button', null, 'Try again'); b.type = 'button'; b.onclick = load; e.appendChild(b); box.appendChild(e); return;
      }
      ALL = d.deliveries; paint();
    }
    const refresh = async () => { const d = await api('/api/workspace/expected-deliveries?when=all'); if (d.success) { ALL = d.deliveries; paint(); } };
    $('edSearch').addEventListener('input', () => { term = $('edSearch').value; paint(); });

    (async () => {
      const me = await api('/api/workspace/me');
      if (me.success) {
        const has = (k) => me.is_admin || (me.permissions || []).includes(k);
        canReceive = has('grn.create'); canDate = has('po.update_delivery'); $('receiveLink').hidden = !canReceive;
      }
      load();
    })();
  </script>
