<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Raw Material Indent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p><a href="index.html">&larr; Home</a> | <a href="production-indent-list.html">All indents</a></p>
  <h1>Production Raw Material Indent</h1>
  <p id="message"></p>

  <form id="indForm">
    <p><label>Production head<br><input id="head" size="30" required></label></p>

    <h3>Chemicals needed</h3>
    <table id="items">
      <thead><tr><th>Item name</th><th>Qty</th><th>Unit</th><th>Required by</th><th>Priority</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p><button type="button" id="addRow">+ Add item</button></p>
    <p><button type="submit" id="saveBtn">Submit indent</button></p>
  </form>

  <script src="common.js"></script>
  <script>
    const tbody = document.querySelector('#items tbody');
    function addRow() {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input class="name" size="24"></td>' +
        '<td><input class="qty" type="number" min="0" step="any" style="width:80px"></td>' +
        '<td><select class="unit"><option>Litre</option><option>Kg</option><option>Nos</option><option>Drum</option></select></td>' +
        '<td><input class="req" type="date"></td>' +
        '<td><select class="pri"><option>low</option><option selected>normal</option><option>high</option><option>urgent</option></select></td>' +
        '<td><button type="button" class="del">X</button></td>';
      tbody.appendChild(tr);
      tr.querySelector('.del').onclick = () => { if (tbody.rows.length > 1) tr.remove(); };
    }
    document.getElementById('addRow').onclick = addRow;
    addRow();

    document.getElementById('indForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const items = [...tbody.rows].map(tr => ({
        item_name: tr.querySelector('.name').value,
        quantity: tr.querySelector('.qty').value,
        unit: tr.querySelector('.unit').value,
        required_by: tr.querySelector('.req').value || null,
        priority: tr.querySelector('.pri').value
      }));
      const btn = document.getElementById('saveBtn'); btn.disabled = true;
      const d = await api('/api/production-indent/create', 'POST', {
        production_head: document.getElementById('head').value, items
      });
      btn.disabled = false;
      if (d.success) {
        show(d.indent_number + ' submitted (status: pending)', true);
        document.getElementById('indForm').reset();
        tbody.innerHTML = ''; addRow();
      } else { show('Error: ' + d.error, false); }
    });
  </script>
</body>
</html>
