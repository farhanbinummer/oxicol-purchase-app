<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Raw Material Indent</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <p><a href="index.html">&larr; Home</a> | <a href="production-indent-list.html">All indents</a></p>
  <h1>Production Raw Material Indent</h1>
  <p class="oxi-page-sub">List the raw materials production needs, how many, and how urgent.</p>
  <p id="message"></p>

  <form id="indForm">
    <p><label>Production head<br><input id="head" size="30" required></label></p>

    <h3>Chemicals needed</h3>
    <table id="items">
      <thead><tr><th>Item name</th><th>Qty</th><th>Unit</th><th>Required by</th><th>Priority</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p><button type="button" id="addRow">+ Add item</button></p>
    <p><button type="submit" id="saveBtn">Submit indent</button></p>
  </form>

  <script src="common.js"></script>
  <script src="material-picker.js"></script>
  <script>
    const tbody = document.querySelector('#items tbody');
    function addRow(pre) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input class="name" size="24" aria-label="Chemical name: type to search raw materials"></td>' +
        '<td><input class="qty" type="number" min="0" step="any" style="width:80px"></td>' +
        '<td><select class="unit"><option>Litre</option><option>Kg</option><option>Nos</option><option>Drum</option></select></td>' +
        '<td><input class="req" type="date"></td>' +
        '<td><select class="pri"><option>low</option><option selected>normal</option><option>high</option><option>urgent</option></select></td>' +
        '<td><button type="button" class="del">X</button></td>';
      tbody.appendChild(tr);
      if (pre) {                                             // editing: start from what was saved
        tr.querySelector('.name').value = pre.item_name; tr.querySelector('.qty').value = Number(pre.quantity);
        const u = tr.querySelector('.unit'); if (![...u.options].some(o => o.value === pre.unit || o.text === pre.unit)) { const o = document.createElement('option'); o.textContent = pre.unit; u.appendChild(o); } u.value = pre.unit;
        if (pre.required_by) tr.querySelector('.req').value = String(pre.required_by).slice(0, 10); tr.querySelector('.pri').value = pre.priority || 'normal';
      }
      tr.querySelector('.del').onclick = () => { if (tbody.rows.length > 1) tr.remove(); };
      oxiMaterialPicker(tr.querySelector('.name'), { onPick: (m) => { const u = tr.querySelector('.unit'); if (m.unit && [...u.options].some(o => o.value === m.unit || o.text === m.unit)) u.value = m.unit; tr.querySelector('.qty').focus(); } });
    }
    document.getElementById('addRow').onclick = () => addRow();
    const editId = new URLSearchParams(location.search).get('edit');
    let version = 0;
    if (editId) {
      // changing a request that is already raised: only its requester, and only while it is pending (the server checks again)
      document.getElementById('indForm').hidden = true;
      document.querySelector('h1').textContent = 'Change production request';
      api('/api/production-indent/' + encodeURIComponent(editId)).then(d => {
        if (!d.success || !d.can_edit) {
          show(d.success ? 'This request can no longer be changed. Only the person who raised it can change it, and only before it is approved.' : d.error, false);
          const a = document.createElement('a'); a.href = 'production-indent-detail.html?id=' + encodeURIComponent(editId); a.textContent = 'Back to the request'; document.getElementById('message').appendChild(document.createTextNode(' ')); document.getElementById('message').appendChild(a); return;
        }
        document.querySelector('h1').textContent = 'Change ' + d.indent.indent_number;
        document.querySelector('.oxi-page-sub').textContent = 'You can change this request until it is approved. The approver is told when you save.';
        document.getElementById('head').value = d.indent.production_head; version = d.indent.edit_count;
        tbody.innerHTML = ''; d.items.forEach(i => addRow(i)); document.getElementById('saveBtn').textContent = 'Save changes'; document.getElementById('indForm').hidden = false;
      });
    } else addRow();

    document.getElementById('indForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const items = [...tbody.rows].map(tr => ({
        item_name: tr.querySelector('.name').value,
        material_id: tr.querySelector('.name').dataset.materialId || undefined,
        quantity: tr.querySelector('.qty').value,
        unit: tr.querySelector('.unit').value,
        required_by: tr.querySelector('.req').value || null,
        priority: tr.querySelector('.pri').value
      }));
      const btn = document.getElementById('saveBtn'); btn.disabled = true;
      if (editId) {
        const r = await api('/api/production-indent/' + encodeURIComponent(editId), 'PUT', { production_head: document.getElementById('head').value, items, version });
        btn.disabled = false;
        if (r.success) location.href = 'production-indent-detail.html?id=' + encodeURIComponent(editId) + '&saved=1'; else show('Error: ' + r.error, false);
        return;
      }
      const d = await api('/api/production-indent/create', 'POST', {
        production_head: document.getElementById('head').value, items
      });
      btn.disabled = false;
      if (d.success) {
        show(d.indent_number + ' submitted (status: pending)', true);
        document.getElementById('indForm').reset();
        tbody.innerHTML = ''; addRow();
      } else { show('Error: ' + d.error, false); }
    });
  </script>
</body>
</html>
