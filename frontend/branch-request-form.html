<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branch Stock Request</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <p><a href="index.html">Home</a> &rsaquo; <a href="branch-request-list.html">Branch Requests</a> &rsaquo; New request</p>
  <h1>New Branch Stock Request</h1>
  <p class="oxi-page-sub">Ask the store for the finished products your branch needs. Pick each product from the catalogue so the right recipe and pack size are used.</p>
  <p id="message" role="status"></p>

  <form id="reqForm" novalidate>
    <p><label>Branch<br>
      <select id="branch" required>
        <option value="">-- Select branch --</option>
        <option>Kannur</option><option>Thrissur</option><option>Trivandrum</option><option>Ernakulam</option>
      </select></label></p>
    <p>Requested by: <b id="who"></b> <small>(recorded automatically from your login)</small></p>
    <p><label>Delivery needed by<br><input type="date" id="deadline"></label></p>
    <p><label>Priority<br><select id="priority"><option value="normal">Normal</option><option value="urgent">Urgent</option></select></label></p>

    <h3>Items needed</h3>
    <table id="items">
      <thead><tr><th>Finished product</th><th>Qty</th><th>Unit</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p><button type="button" id="addRow">+ Add item</button></p>
    <p id="formError" class="error" role="alert" hidden></p>
    <p><button type="submit" id="saveBtn">Submit request</button></p>
  </form>

  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let me = null; try { me = JSON.parse(localStorage.getItem('oxicol_user') || 'null'); } catch (e) {}
    $('who').textContent = me ? me.name : '';
    if (me && me.role === 'branch' && me.branch) { $('branch').value = me.branch; $('branch').disabled = true; }

    // ---------- catalogue picker: the server searches, the person chooses; the chosen product's ID is what is saved ----------
    const dd = document.createElement('div'); dd.className = 'oxi-ac'; dd.setAttribute('role', 'listbox'); dd.hidden = true; document.body.appendChild(dd);
    let acInput = null, acIdx = -1, acList = [], acTimer = null, acSeq = 0;
    const tbody = document.querySelector('#items tbody');

    function closeAc() { dd.hidden = true; acInput = null; acIdx = -1; }
    function placeAc() {
      if (dd.hidden || !acInput) return;
      const r = acInput.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight) { closeAc(); return; }
      dd.style.left = r.left + 'px'; dd.style.width = Math.max(r.width, 260) + 'px';
      const below = window.innerHeight - r.bottom;
      if (below < 220 && r.top > below) { dd.style.top = 'auto'; dd.style.bottom = (window.innerHeight - r.top + 4) + 'px'; }
      else { dd.style.bottom = 'auto'; dd.style.top = (r.bottom + 4) + 'px'; }
    }
    function paint(items, query) {
      if (dd.parentNode !== document.body) document.body.appendChild(dd); // the page shell wraps content in a glass panel, which would skew fixed positioning
      acList = items; acIdx = -1; dd.innerHTML = '';
      if (!items.length) { const n = document.createElement('div'); n.className = 'oxi-ac-none'; n.textContent = query ? 'No matching product in the catalogue' : 'Start typing a product name or code'; dd.appendChild(n); }
      items.forEach(p => {
        const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'option');
        const name = document.createElement('span'); name.textContent = p.name;
        const meta = document.createElement('small'); meta.style.cssText = 'display:block;color:var(--text-muted)';
        meta.textContent = p.code + (p.pack_size ? ' - ' + p.pack_size : '') + (p.has_recipe ? '' : ' - no recipe yet');
        b.append(name, meta);
        b.addEventListener('pointerdown', (e) => e.preventDefault());
        b.addEventListener('click', () => pick(p));
        dd.appendChild(b);
      });
      dd.hidden = false; placeAc();
    }
    async function search(input) {
      const seq = ++acSeq; acInput = input;
      const q = input.value.trim();
      let d; try { d = await api('/api/catalog/products/search?limit=8&q=' + encodeURIComponent(q)); } catch (e) { return; }
      if (seq !== acSeq || acInput !== input) return; // a newer keystroke superseded this answer
      if (d.success) paint(d.products, q);
    }
    function pick(p) {
      if (!acInput) return;
      const tr = acInput.closest('tr');
      acInput.value = p.name; acInput.dataset.productId = p.id;
      tr.querySelector('.unit').textContent = p.base_unit;
      markRow(tr, null); closeAc();
      const q = tr.querySelector('.qty'); if (q) q.focus();
    }
    function markRow(tr, text) {
      let h = tr.querySelector('.oxi-ac-hint');
      if (!h) { h = document.createElement('small'); h.className = 'oxi-ac-hint'; tr.querySelector('td').appendChild(h); }
      h.textContent = text || '';
    }
    function moveAc(d) {
      const opts = [...dd.querySelectorAll('button')]; if (!opts.length) return;
      acIdx = (acIdx + d + opts.length) % opts.length;
      opts.forEach((o, i) => o.classList.toggle('active', i === acIdx)); opts[acIdx].scrollIntoView({ block: 'nearest' });
    }
    document.addEventListener('input', (e) => {
      if (!e.target.matches('#items .name')) return;
      delete e.target.dataset.productId; e.target.closest('tr').querySelector('.unit').textContent = '-';
      clearTimeout(acTimer); acTimer = setTimeout(() => search(e.target), 150);
    });
    document.addEventListener('focusin', (e) => { if (e.target.matches('#items .name')) search(e.target); });
    document.addEventListener('focusout', (e) => {
      if (!e.target.matches('#items .name')) return;
      setTimeout(() => { if (document.activeElement !== e.target) closeAc(); }, 150);
    });
    document.addEventListener('keydown', (e) => {
      if (dd.hidden || !e.target.matches('#items .name')) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); moveAc(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveAc(-1); }
      else if (e.key === 'Enter' && acIdx >= 0) { e.preventDefault(); pick(acList[acIdx]); }
      else if (e.key === 'Escape') closeAc();
    });
    window.addEventListener('scroll', placeAc, true); window.addEventListener('resize', placeAc);

    function addRow() {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input class="name" size="28" autocomplete="off" placeholder="Search product name or code" aria-label="Finished product"></td>' +
        '<td><input class="qty" type="number" min="0" step="any" inputmode="decimal" aria-label="Quantity"></td>' +
        '<td class="unit" aria-label="Unit">-</td>' +
        '<td><button type="button" class="del" aria-label="Remove this item">X</button></td>';
      tbody.appendChild(tr);
      tr.querySelector('.del').onclick = () => { if (tbody.rows.length > 1) tr.remove(); };
    }
    $('addRow').onclick = addRow;
    addRow();

    // ---------- submit: validate beside the field, keep everything typed on failure, block double submits ----------
    let submitting = false;
    $('reqForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitting) return;
      const err = $('formError'); err.hidden = true;
      let bad = false;
      const items = [...tbody.rows].map(tr => {
        const input = tr.querySelector('.name'), qty = tr.querySelector('.qty');
        const productId = Number(input.dataset.productId || 0);
        if (!productId) { markRow(tr, 'Choose a product from the list'); bad = true; } else markRow(tr, null);
        if (!(Number(qty.value) > 0)) { bad = true; markRow(tr, (tr.querySelector('.oxi-ac-hint').textContent ? tr.querySelector('.oxi-ac-hint').textContent + '. ' : '') + 'Enter a quantity above 0'); }
        return { product_id: productId, quantity: qty.value };
      });
      if (!$('branch').value && !$('branch').disabled) { err.textContent = 'Select the branch.'; err.hidden = false; return; }
      if (bad) { err.textContent = 'Please fix the highlighted items. Nothing has been submitted.'; err.hidden = false; return; }
      submitting = true; const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Submitting...';
      let d;
      try {
        d = await api('/api/branch-request/create', 'POST', {
          branch: $('branch').value || (me && me.branch), delivery_needed_by: $('deadline').value, priority: $('priority').value, items
        });
      } catch (ex) { d = { success: false, error: 'Network problem - your entries are still here, please try again.' }; }
      submitting = false; btn.disabled = false; btn.textContent = 'Submit request';
      if (d.success) {
        show(d.request_number + ' submitted - waiting for store approval', true);
        $('reqForm').reset(); if (me && me.role === 'branch' && me.branch) $('branch').value = me.branch;
        tbody.innerHTML = ''; addRow();
      } else { err.textContent = d.error; err.hidden = false; show('Error: ' + d.error, false); }
    });
  </script>
</body>
</html>
