<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Order</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    .wo-num { text-align: right; font-variant-numeric: tabular-nums; } .wo-short { color: var(--danger); font-weight: 700; } .wo-ok { color: var(--success); font-weight: 700; }
    .wo-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 14px 0 18px; max-width: 760px; } .wo-step { text-align: center; font-size: 13px; color: var(--text-2); padding-top: 26px; position: relative; }
    .wo-step::before { content: ""; position: absolute; top: 8px; left: -50%; right: 50%; height: 3px; background: var(--border-strong); } .wo-step:first-child::before { display: none; }
    .wo-step::after { content: ""; position: absolute; top: 1px; left: 50%; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%; border: 3px solid var(--border-strong); background: var(--surface); box-sizing: border-box; }
    .wo-step.done::before { background: var(--success); } .wo-step.done::after { background: var(--success); border-color: var(--success); } .wo-step.now::before { background: var(--success); } .wo-step.now::after { border-color: var(--accent); box-shadow: 0 0 0 4px var(--primary-soft); } .wo-step.bad::after { background: var(--danger); border-color: var(--danger); } .wo-step b { display: block; color: var(--text); }
    .wo-panel { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--surface); margin: 0 0 16px; max-width: 760px; } .wo-panel h3 { margin-top: 0; } .wo-panel label { display: block; margin: 0 0 10px; font-size: 13px; color: var(--text-2); }
    .wo-banner { padding: 10px 14px; border-radius: 12px; margin: 0 0 14px; max-width: 760px; font-weight: 600; } .wo-banner.bad { background: var(--danger-bg); color: var(--danger); } .wo-banner.good { background: var(--success-bg); color: var(--success); }
    @media print { .no-print, nav, .wo-panel.act { display: none !important; } }
  </style>
</head>
<body>
  <p class="no-print"><a href="index.html">&larr; Home</a> | <a href="work-orders.html">All work orders</a></p>
  <h1 id="title">Work order</h1>
  <p class="oxi-page-sub" id="sub"></p>
  <p id="message" role="status"></p>
  <div id="banner"></div>
  <div class="wo-steps" id="steps" aria-hidden="true"></div>
  <table style="width:auto" id="facts"></table>

  <h3>Raw materials</h3>
  <table><thead><tr><th>Material</th><th class="wo-num">Planned</th><th class="wo-num" id="thIssue">Issued</th><th class="wo-num">In store now</th></tr></thead><tbody id="mats"></tbody></table>

  <div id="actions"></div>
  <p class="no-print"><button type="button" class="oxi-btn-secondary" onclick="window.print()">Print batch sheet</button></p>
  <script src="common.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id'); let D = null;
    const el = (t, txt, cls) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    const qn = (n) => n == null ? '-' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: 3 });
    const when = (d) => d ? new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    const LABEL = { planned: 'Waiting for materials', issued: 'In production', completed: 'Waiting for quality check', qc_passed: 'Passed quality check', qc_failed: 'Failed quality check', cancelled: 'Cancelled' };
    const api2 = (p, m, b) => api('/api/work-orders/' + encodeURIComponent(id) + p, m, b);

    async function load() {
      const d = await api('/api/work-orders/' + encodeURIComponent(id)); if (!d.success) { show(d.error || 'Could not load', false); return; }
      D = d; const w = d.work_order, st = w.status;
      document.getElementById('title').textContent = w.batch_number + ' - ' + w.product_name;
      document.getElementById('sub').textContent = LABEL[st] || st;
      const ban = document.getElementById('banner'); ban.innerHTML = '';
      if (st === 'qc_failed') ban.appendChild(el('div', 'This batch FAILED quality check' + (w.qc_notes ? ': ' + w.qc_notes : ''), 'wo-banner bad'));
      if (st === 'qc_passed') ban.appendChild(el('div', 'Passed quality check' + (w.qc_notes ? ': ' + w.qc_notes : ''), 'wo-banner good'));
      if (st === 'cancelled') ban.appendChild(el('div', 'Cancelled: ' + (w.cancel_reason || ''), 'wo-banner bad'));
      // steps
      const steps = document.getElementById('steps'); steps.innerHTML = '';
      const order = ['planned', 'issued', 'completed', 'qc_passed']; const idx = st === 'qc_failed' ? 3 : Math.max(0, order.indexOf(st));
      [['Planned', w.created_by_name || ''], ['Materials issued', w.issued_by_name || ''], ['Made', w.finished_qty != null ? qn(w.finished_qty) + ' ' + w.unit : ''], [st === 'qc_failed' ? 'Failed QC' : 'Passed QC', w.qc_by_name || '']].forEach(([t, s], i) => {
        const x = el('div', undefined, 'wo-step ' + (st === 'cancelled' ? '' : i < idx ? 'done' : i === idx ? (st === 'qc_passed' ? 'done' : st === 'qc_failed' ? 'bad' : 'now') : '')); x.append(el('b', t), el('span', s)); steps.appendChild(x); });
      // facts
      const f = document.getElementById('facts'); f.innerHTML = '';
      const row = (k, v) => { if (v === '' || v == null) return; const tr = el('tr'); tr.append(el('td', k), el('td', v)); const b = tr.children[1]; b.style.fontWeight = '600'; f.appendChild(tr); };
      row('Batch number', w.batch_number); row('Product', w.product_name); row('Planned quantity', qn(w.planned_qty) + ' ' + w.unit); row('Recipe version', w.recipe_version ? 'v' + w.recipe_version : ''); row('Planned date', w.planned_date);
      row('Made', w.finished_qty != null ? qn(w.finished_qty) + ' ' + w.unit + ' (yield ' + w.yield_pct + '%)' : ''); row('Finished on', w.finished_on); row('Result notes', w.result_notes); row('Notes', w.notes);
      row('Planned by', w.created_by_name ? w.created_by_name + ', ' + when(w.created_at) : ''); row('Materials issued by', w.issued_by_name ? w.issued_by_name + ', ' + when(w.issued_at) : ''); row('Result recorded by', w.completed_by_name ? w.completed_by_name + ', ' + when(w.completed_at) : ''); row('Quality check by', w.qc_by_name ? w.qc_by_name + ', ' + when(w.qc_at) : '');
      // materials
      const mb = document.getElementById('mats'); mb.innerHTML = ''; const issuing = d.can.issue;
      document.getElementById('thIssue').textContent = issuing ? 'Issue now' : 'Issued';
      d.materials.forEach(m => { const tr = el('tr'); tr.append(el('td', m.name), el('td', qn(m.planned_qty) + ' ' + (m.unit || ''), 'wo-num'));
        const td = el('td', undefined, 'wo-num');
        if (issuing) { const i = el('input'); i.type = 'number'; i.min = '0'; i.step = 'any'; i.className = 'issueq'; i.dataset.m = m.material_id; i.style.width = '110px'; i.value = Math.round(m.planned_qty * 1000) / 1000; td.appendChild(i); }
        else td.textContent = m.issued_qty == null ? '-' : qn(m.issued_qty) + ' ' + (m.unit || '');
        tr.appendChild(td);
        const on = el('td', qn(m.on_hand) + ' ' + (m.unit || ''), 'wo-num'); if (issuing && m.on_hand + 1e-9 < m.planned_qty) { on.classList.add('wo-short'); on.title = 'Not enough in store for the planned quantity'; } tr.appendChild(on); mb.appendChild(tr); });
      // actions
      const a = document.getElementById('actions'); a.innerHTML = '';
      const panel = (title) => { const p = el('div', undefined, 'wo-panel act no-print'); p.appendChild(el('h3', title)); a.appendChild(p); return p; };
      const btn = (t, fn, cls) => { const b = el('button', t, cls); b.type = 'button'; b.onclick = async () => { b.disabled = true; try { await fn(); } finally { b.disabled = false; } }; return b; };
      const lab = (t, inp) => { const l = el('label', t); l.appendChild(el('br')); l.appendChild(inp); return l; };
      const inp = (type, attrs = {}) => { const i = el('input'); i.type = type; Object.assign(i, attrs); return i; };
      if (d.can.issue) { const p = panel('Issue the raw materials'); p.appendChild(el('p', 'Change a quantity above if you issue less than planned. The materials are taken out of stock when you click Issue.')); p.appendChild(btn('Issue materials', async () => {
        const lines = [...document.querySelectorAll('.issueq')].map(i => ({ material_id: Number(i.dataset.m), qty: i.value === '' ? 0 : i.value })); const r = await api2('/issue', 'POST', { lines });
        if (r.success) { show('Materials issued', true); load(); } else show(r.error, false); })); }
      if (d.can.complete) { const p = panel('Record what was made'); const q = inp('number', { min: '0', step: 'any' }), dt = inp('date'), n = inp('text', { maxLength: 300 }); dt.value = new Date().toISOString().slice(0, 10); n.style.width = '100%';
        p.append(lab('Quantity made (' + w.unit + ')', q), lab('Finished on', dt), lab('Notes (optional)', n)); p.appendChild(btn('Save result', async () => { const r = await api2('/complete', 'POST', { finished_qty: q.value, finished_on: dt.value, result_notes: n.value }); if (r.success) { show('Saved. Yield ' + r.yield_pct + '%', true); load(); } else show(r.error, false); })); }
      if (d.can.qc) { const p = panel('Quality check'); const n = inp('text', { maxLength: 300 }); n.style.width = '100%'; p.appendChild(lab('Notes (required if it fails)', n));
        p.appendChild(btn('Pass', async () => { const r = await api2('/qc', 'POST', { passed: true, notes: n.value }); if (r.success) { show('Passed', true); load(); } else show(r.error, false); }));
        const f2 = btn('Fail', async () => { const r = await api2('/qc', 'POST', { passed: false, notes: n.value }); if (r.success) { show('Marked as failed', true); load(); } else show(r.error, false); }, 'oxi-danger'); f2.style.marginLeft = '8px'; p.appendChild(f2); }
      if (d.can.edit) { const e = el('a', 'Change quantity or date', 'oxi-btn oxi-btn-secondary'); e.href = 'work-order-form.html?edit=' + encodeURIComponent(id); e.style.marginRight = '8px'; a.appendChild(e); }
      if (d.can.cancel) { a.appendChild(btn('Cancel this batch', async () => { const why = prompt('Why is this batch being cancelled?'); if (!why) return; const r = await api2('/cancel', 'POST', { reason: why }); if (r.success) { show('Cancelled' + (r.returned ? ': materials returned to stock' : ''), true); load(); } else show(r.error, false); }, 'oxi-danger')); }
    }
    load();
  </script>
</body>
</html>
