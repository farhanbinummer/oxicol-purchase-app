<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R&amp;D Project</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    .oxi-tabs { overflow-x: auto; scrollbar-width: thin; } .oxi-tabs button { white-space: nowrap; }
    .tr-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 var(--s2); } .tr-head h2 { margin: 0; }
    .tr-pref { margin: 0 0 var(--s3); padding: 8px 12px; border-radius: 10px; background: var(--success-bg); color: var(--success); font-weight: 600; font-size: 14px; }
    .tr-empty { text-align: center; padding: var(--s5) var(--s3); } .tr-empty strong { display: block; font-size: 18px; margin-bottom: 4px; }
    .tr-chartbox { max-width: 100%; overflow-x: auto; } .tr-chart { display: block; max-width: none; }
    .tr-pass { fill: var(--success); background: var(--success); } .tr-fail { fill: var(--danger); background: var(--danger); } .tr-none { fill: var(--border-strong, #94a3b8); background: var(--border-strong, #94a3b8); }
    .tr-num { fill: #fff; font: 700 12px sans-serif; } .tr-num.dark { fill: var(--text); } .tr-axis { fill: var(--text-2); font: 12px sans-serif; } .tr-star { fill: var(--success); font: 700 11px sans-serif; } .tr-grid { stroke: var(--border); stroke-width: 1; }
    .tr-legend { list-style: none; display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; padding: 0; font-size: 13px; color: var(--text-2); }
    .tr-key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; }
    .tr-grid-table th, .tr-grid-table td { text-align: center; } .tr-grid-table th:first-child { text-align: left; min-width: 150px; }
    .tr-cell { font-weight: 700; min-width: 54px; } .tr-c-pass { background: var(--success-bg); color: var(--success); } .tr-c-fail { background: var(--danger-bg); color: var(--danger); } .tr-c-nottested { background: var(--surface-2); color: var(--text-2); }
    .tr-res { display: inline-block; padding: 2px 8px; border-radius: 8px; font-weight: 600; font-size: 13px; }
    .tr-dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 var(--s3); } .tr-dl dt { color: var(--text-2); font-weight: 600; } .tr-dl dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .tr-corr { margin: 0 0 var(--s3); padding-left: 18px; } .tr-corr li { margin: 0 0 8px; overflow-wrap: anywhere; }
    .tr-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .tr-res-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; align-items: end; padding: 8px 0; border-top: 1px solid var(--border); } .tr-res-name small { display: block; color: var(--text-2); }
    dialog.oxi-dlg { max-height: 92vh; overflow-y: auto; }
    table.oxi-nocards { display: table; overflow: visible; max-width: none; } #trialsview .oxi-card2, #trialsview .oxi-table-scroll { min-width: 0; max-width: 100%; } #trialsview .oxi-table-scroll { position: relative; }      /* keeps the hidden screen-reader text inside the scrolling grid */
    .tr-warn { margin: 0 0 var(--s3); padding: 8px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 14px; }
    .tr-ovrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 var(--s2); } .tr-stat b { display: block; font-size: 22px; line-height: 1.2; } .tr-stat span { font-size: 13px; color: var(--text-2); }
    .tr-extra-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; margin: 0 0 8px; align-items: center; }
    .tr-files { list-style: none; margin: 0 0 var(--s2); padding: 0; display: grid; gap: 8px; } .tr-file { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--border); border-radius: 10px; }
    .tr-thumb { width: 64px; height: 64px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; font-weight: 700; color: var(--text-2); } .tr-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .tr-fileinfo { min-width: 0; overflow-wrap: anywhere; } .tr-fileinfo small { display: block; color: var(--text-2); } .tr-fileact { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .tr-filebtn { display: inline-block; padding: 9px 14px; border: 1px solid var(--border-strong, var(--border)); border-radius: var(--r-control, 8px); font-weight: 600; cursor: pointer; background: var(--surface); } .tr-filebtn:focus-visible { outline: 3px solid var(--accent, #0f766e); outline-offset: 2px; }
    @media (max-width: 560px) { .tr-extra-row { grid-template-columns: 1fr; } .tr-file { grid-template-columns: 56px 1fr; } .tr-fileact { grid-column: 1 / -1; justify-content: flex-start; } }
    @media (max-width: 560px) { .tr-two, .tr-res-row { grid-template-columns: 1fr; } .tr-dl { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .tr-chart * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <p><a href="index.html">Home</a> &rsaquo; <a href="projects.html">R&amp;D Projects</a></p>
  <h1 id="pageTitle">Project</h1>
  <p id="message" role="status"></p>
  <div id="banner" class="oxi-banner" role="alert" hidden></div>
  <div id="meta" class="oxi-pmeta"></div>
  <section class="oxi-prog" aria-labelledby="progHead">
    <h2 class="oxi-prog-head" id="progHead"></h2>
    <div class="oxi-steps-scroll" id="stepsScroll" role="region" aria-label="Development stages" tabindex="0"><ol class="oxi-steps" id="stagebar"></ol></div>
  </section>

  <div class="oxi-tabs" role="tablist" aria-label="Project views">
    <button type="button" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" data-tab="overview">Overview</button>
    <button type="button" role="tab" id="tab-list" aria-controls="panel-list" aria-selected="false" data-tab="list" tabindex="-1">List</button>
    <button type="button" role="tab" id="tab-board" aria-controls="panel-board" aria-selected="false" data-tab="board" tabindex="-1">Board</button>
    <button type="button" role="tab" id="tab-timeline" aria-controls="panel-timeline" aria-selected="false" data-tab="timeline" tabindex="-1">Timeline</button>
    <button type="button" role="tab" id="tab-activity" aria-controls="panel-activity" aria-selected="false" data-tab="activity" tabindex="-1">Activity</button>
    <button type="button" role="tab" id="tab-trials" aria-controls="panel-trials" aria-selected="false" data-tab="trials" tabindex="-1" hidden>Trials</button>
  </div>

  <div id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"><div id="overview" aria-busy="true"></div></div>
  <div id="panel-list" role="tabpanel" aria-labelledby="tab-list" hidden><div id="listview"></div></div>
  <div id="panel-board" role="tabpanel" aria-labelledby="tab-board" hidden><div id="boardview"></div></div>
  <div id="panel-timeline" role="tabpanel" aria-labelledby="tab-timeline" hidden><div id="timelineview"></div></div>
  <div id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" hidden><div id="activityview"></div></div>
  <div id="panel-trials" role="tabpanel" aria-labelledby="tab-trials" hidden><div id="trialsview"></div></div>

  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const pid = Number(new URLSearchParams(location.search).get('id'));
    let D = null, meta = null, people = [], dirtyAssess = false, lastFocus = null;

    const TASK_STATUS = [['todo', 'To do'], ['in_progress', 'In progress'], ['blocked', 'Blocked'], ['in_review', 'In review'], ['done', 'Done']];
    const TASK_LABEL = Object.fromEntries(TASK_STATUS.concat([['cancelled', 'Cancelled']]));
    // a task is finished only with "Complete task", which asks for the result; the status boxes never set Done directly
    const TASK_OPEN_STATUS = TASK_STATUS.filter(x => ['todo', 'in_progress', 'blocked'].includes(x[0]));
    const TASK_MOVE = TASK_STATUS.filter(x => x[0] !== 'in_review');        // 'In review' is reached only by handing the work in
    const byName = (tk) => (tk.completed_by_name || '-') + (tk.on_behalf_name ? ' (covering for ' + tk.on_behalf_name + ')' : '');
    const covers = (tk) => !!tk.assignee_id && (D.covering_ids || []).includes(tk.assignee_id);
    const canFinish = (tk) => D.can.edit || (tk.assignee_id && D.me_id === tk.assignee_id) || covers(tk);
    // the person who did the work cannot review it; reviewers are R&D people with edit rights
    const canReview = (tk) => D.can.edit && tk.status === 'in_review' && D.me_id !== tk.assignee_id && D.me_id !== tk.completed_by;
    const submitsForReview = (tk) => tk.requires_review && (tk.assignee_id === D.me_id || covers(tk));
    let closeTaskPanel = null;
    const APPROVAL_ROWS = ['rd_head', 'management', 'qc_signoff', 'customer', 'handover_ack'];
    const DECISION_TEXT = { approved: 'Approved', rejected: 'Rejected', returned: 'Returned for more information', submitted: 'Submitted' };

    // ------------------------------------------------------------------ helpers
    function note(text, ok) { const m = $('message'); m.textContent = text; m.className = ok ? 'success' : 'error'; if (!ok) m.scrollIntoView({ block: 'nearest' }); }
    function banner(text, reload) {
      const b = $('banner'); b.innerHTML = ''; b.appendChild(document.createTextNode(text));
      if (reload) { const r = el('button', null, 'Reload the project'); r.type = 'button'; r.onclick = () => { b.hidden = true; load(); }; b.appendChild(r); }
      b.hidden = false;
    }
    /** Shows an API failure where the person is looking: inside the open dialog, otherwise on the page. */
    function fail(r, box) {
      const text = (r && r.error) || 'That did not work.';
      const stale = r && r.current_version !== undefined && !r.cooldown;
      if (box) { box.textContent = text; box.hidden = false; }
      else note(text, false);
      if (stale) banner('This project was changed by someone else. Reload to see their changes before trying again.', true);
    }
    function field(label, ctl, id, hint) {
      const w = el('div'); const l = el('label', null, label); ctl.id = id; l.htmlFor = id; w.append(l, ctl);
      if (hint) { const h = el('div', 'oxi-section-note', hint); h.style.margin = '2px 0 0'; w.appendChild(h); }
      return w;
    }
    function select(options, value, blank) {
      const s = el('select');
      if (blank != null) { const o = el('option', null, blank); o.value = ''; s.appendChild(o); }
      options.forEach(x => { const [v, t] = Array.isArray(x) ? x : [x, x]; const o = el('option', null, t); o.value = v; s.appendChild(o); });
      s.value = value == null ? '' : String(value); return s;
    }
    const personOptions = () => people.map(p => [p.id, p.name]);
    function dateInput(value, max) { const i = el('input'); i.type = 'date'; i.value = value || ''; if (max) i.max = max; return i; }


    // ------------------------------------------------------------------ presentation helpers (inline SVG and CSS only)
    const SVGNS = 'http://www.w3.org/2000/svg';
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ICON = {
      check: 'M5 13l4 4L19 7', alert: 'M12 9v4m0 4h.01M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
      clock: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z', user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      userplus: 'M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M19 8v6M16 11h6', calendar: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      flag: 'M5 21V4M5 4h12l-2 4 2 4H5', tag: 'M3 12V4h8l10 10-8 8zM7.5 8.5h.01', pause: 'M8 5v14M16 5v14', tasks: 'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01',
      stop: 'M5.6 5.6l12.8 12.8M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z'
    };
    function svgEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v)); return e; }
    function icon(name, size) { const s = svgEl('svg', { viewBox: '0 0 24 24', width: size || 16, height: size || 16, fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', focusable: 'false' }); s.appendChild(svgEl('path', { d: ICON[name] || ICON.flag })); return s; }
    const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
    const avatar = (name) => el('span', 'oxi-avatar', initials(name));
    /** A small pill: icon, a quiet label and the value. children are appended after the label. */
    function chip(iconName, label, ...value) {
      const c = el('span', 'oxi-chip'); const ic = el('span', 'ci'); ic.appendChild(icon(iconName, 14)); c.appendChild(ic);
      const t = el('span'); t.append(el('small', null, label + ' '), ...value.map(v => typeof v === 'string' ? document.createTextNode(v) : v)); c.appendChild(t); return c;
    }
    /** Donut ring. segs = [{ value, color }] (a CSS colour or token); the centre shows big and small text. The svg is described by `label`. */
    function ringChart(segs, total, opt) {
      const size = opt.size || 112, sw = opt.stroke || 12, r = (size - sw) / 2, C = 2 * Math.PI * r;
      const svg = svgEl('svg', { viewBox: '0 0 ' + size + ' ' + size, width: size, height: size, role: 'img', 'aria-label': opt.label, class: 'oxi-ring' });
      svg.appendChild(svgEl('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--border)', 'stroke-width': sw }));
      let acc = 0; const live = [];
      segs.filter(g => g.value > 0 && total > 0).forEach(g => {
        const len = g.value / total * C;
        const c = svgEl('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: g.color, 'stroke-width': sw, 'stroke-dasharray': (REDUCED ? len : 0) + ' ' + C, 'stroke-dashoffset': -acc, transform: 'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')', class: 'seg' });
        svg.appendChild(c); live.push([c, len, C]); acc += len;
      });
      if (!REDUCED) requestAnimationFrame(() => requestAnimationFrame(() => live.forEach(([c, len, CC]) => c.setAttribute('stroke-dasharray', len + ' ' + CC))));
      const big = svgEl('text', { x: size / 2, y: size / 2 + (opt.small ? 2 : 7), 'text-anchor': 'middle', class: 'ring-big' }); big.textContent = opt.big; svg.appendChild(big);
      if (opt.small) { const sm = svgEl('text', { x: size / 2, y: size / 2 + 20, 'text-anchor': 'middle', class: 'ring-small' }); sm.textContent = opt.small; svg.appendChild(sm); }
      return svg;
    }
    /** Horizontal stacked bar. segs = [{ value, cls }]; `label` is the text alternative. */
    function stackBar(segs, label) {
      const total = segs.reduce((a, g) => a + g.value, 0); const b = el('div', 'oxi-stack'); b.setAttribute('role', 'img'); b.setAttribute('aria-label', label);
      segs.filter(g => g.value > 0).forEach(g => { const i = el('i', g.cls); i.style.flexGrow = String(g.value); b.appendChild(i); });
      if (!total) b.classList.add('empty'); return b;
    }
    /** Determinate progress bar. */
    function progressBar(pct, cls, label) {
      const b = el('div', 'oxi-meter' + (cls ? ' ' + cls : '')); b.setAttribute('role', 'progressbar'); b.setAttribute('aria-valuemin', '0'); b.setAttribute('aria-valuemax', '100'); b.setAttribute('aria-valuenow', String(Math.round(pct))); b.setAttribute('aria-label', label);
      const i = el('i'); i.style.width = (REDUCED ? Math.round(pct) : 0) + '%'; b.appendChild(i);
      if (!REDUCED) requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = Math.round(pct) + '%'; })); return b;
    }
    const shortStage = (name) => String(name).split(/ \/ | & /)[0];
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    function focusLead() { const f = $('aLead'); if (f) { f.scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' }); f.focus({ preventScroll: true }); } }

    /** A modal dialog. build(body) fills it and returns a function that reads the answers; onOk(answers, errBox, okButton) must return true to close. */
    function dialog(title, build, okLabel, onOk, opts) {
      lastFocus = document.activeElement;
      const dlg = el('dialog', 'oxi-dlg'); dlg.setAttribute('aria-labelledby', 'dlgTitle');
      const form = el('form'); form.method = 'dialog';
      const h = el('h3', null, title); h.id = 'dlgTitle';
      const body = el('div'); const err = el('div', 'oxi-errtext'); err.setAttribute('role', 'alert'); err.hidden = true;
      const read = build(body, err);
      const row = el('div', 'row');
      const cancel = el('button', 'oxi-btn-secondary', opts && opts.cancelLabel || 'Cancel'); cancel.type = 'button'; cancel.onclick = () => dlg.close();
      const ok = el('button', null, okLabel); ok.type = 'submit';
      if (opts && opts.disableOk) ok.disabled = true;
      row.append(cancel); if (onOk) row.append(ok);
      form.append(h, body, err, row); dlg.appendChild(form); document.body.appendChild(dlg);
      let working = false;
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (working || !onOk) return;
        working = true; ok.disabled = true; err.hidden = true;           // a second click while the request is out does nothing
        let close = false;
        try { close = await onOk(read ? read() : {}, err, ok); } catch (e) { err.textContent = 'Could not reach the server.'; err.hidden = false; }
        working = false; if (!close) ok.disabled = !!(opts && opts.disableOk && opts.stayDisabled && opts.stayDisabled());
        if (close) dlg.close();
      });
      dlg.addEventListener('close', () => { dlg.remove(); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); });
      dlg.showModal();
      const first = dlg.querySelector('input:not([type=hidden]),select,textarea'); if (first) first.focus(); else cancel.focus();
      return dlg;
    }

    // ------------------------------------------------------------------ header and stage tracker
    function renderHeader() {
      const p = D.project;
      $('pageTitle').textContent = p.project_number + ' ' + p.title;
      document.title = p.project_number + ' - R&D Project';
      const m = $('meta'); m.innerHTML = '';
      m.className = 'oxi-metabar';
      // status and priority keep their badges; everything else is a labelled chip with an icon
      const sp = el('span', 'oxi-chip plain'); sp.append(rdBadge(p.status), prioBadge(p.priority)); m.appendChild(sp);
      if (p.status === 'On Hold') { const h = el('span', 'oxi-chip warn'); const ic = el('span', 'ci'); ic.appendChild(icon('pause', 14)); h.append(ic, el('span', null, 'Paused: no stage can be completed until work resumes.')); m.appendChild(h); }
      m.appendChild(chip('user', 'Lead', D.lead ? D.lead.name : 'Not assigned'));
      m.appendChild(chip('flag', 'Target launch', p.target_tbc ? 'To be confirmed' : (p.target_launch_date ? dmy(p.target_launch_date) : '-')));
      m.appendChild(chip('calendar', 'Requested by', (p.requested_by_name || '-') + (p.request_date ? ' on ' + dmy(p.request_date) : '')));
      if (p.project_type) m.appendChild(chip('tag', 'Type', p.project_type));
      const fav = el('button', 'oxi-fav'); fav.type = 'button'; fav.textContent = D.favourite ? '★' : '☆'; fav.setAttribute('aria-pressed', String(D.favourite));
      fav.setAttribute('aria-label', D.favourite ? 'Remove from favourites' : 'Add to favourites');
      fav.onclick = async () => { fav.disabled = true; const r = await api('/api/rd/projects/' + pid + '/favourite', 'PUT', { favourite: !D.favourite }); fav.disabled = false; if (r.success) { D.favourite = r.favourite; renderHeader(); } else fail(r); };
      m.appendChild(fav);
      if (D.can.edit) { const e = el('a', 'oxi-btn oxi-btn-secondary', 'Edit request'); e.href = 'project-new.html?id=' + pid; m.appendChild(e); }
      if (D.can.edit) { const sb = el('button', 'oxi-btn-secondary', 'Change status'); sb.type = 'button'; sb.onclick = statusDialog; m.appendChild(sb); }
      renderStepper();
    }

    /** One connected stepper: tick when complete, pulsing ring for the current stage, amber warning when it needs review. */
    function renderStepper() {
      const done = D.stages.filter(s => s.state === 'done').length, total = D.stages.length, pct = Math.round(done / total * 100);
      const head = $('progHead'); head.innerHTML = '';
      head.append(document.createTextNode(done === total ? 'All ' + total + ' stages complete' : 'Stage ' + (D.current_stage_no || done + 1) + ' of ' + total), el('span', 'pct', '- ' + pct + '% complete'));
      const bar = $('stagebar'); bar.innerHTML = '';
      D.stages.forEach(s => {
        const review = !!s.review_flag;
        const cls = [s.state === 'done' ? 'done' : '', s.state === 'current' ? 'cur' : '', s.state === 'current' && s.overdue ? 'late' : '', review ? 'rev' : ''].filter(Boolean).join(' ');
        const li = el('li', cls);
        const dot = el('span', 'dot'); dot.appendChild(review ? icon('alert', 18) : s.state === 'done' ? icon('check', 18) : document.createTextNode(String(s.no)));
        const status = review ? 'Needs review' : s.state === 'done' ? 'Done ' + dmy(s.actual) : s.overdue ? 'Overdue ' + plural(s.delay, 'day') : s.state === 'current' ? 'Current' : 'Not started';
        li.append(dot, el('span', 'nm', shortStage(s.name)), el('span', 'st', status));
        if (s.planned && s.state !== 'done') li.appendChild(el('span', 'pl', 'Planned ' + dmy(s.planned)));
        li.title = s.name;
        li.setAttribute('aria-label', 'Stage ' + s.no + ', ' + s.name + ': ' + status + (s.planned && s.state !== 'done' ? ', planned ' + dmy(s.planned) : '') + (s.review_flag && s.state === 'done' ? ', done ' + dmy(s.actual) : ''));
        if (s.state === 'current') li.setAttribute('aria-current', 'step');
        bar.appendChild(li);
      });
      // a scroll container is only a tab stop when it really scrolls; bring the current stage into view inside it
      const sc = $('stepsScroll'); requestAnimationFrame(() => {
        const over = sc.scrollWidth > sc.clientWidth + 1;
        if (over) sc.setAttribute('tabindex', '0'); else sc.removeAttribute('tabindex');
        const cur = bar.querySelector('li.cur'); if (over && cur) sc.scrollLeft = Math.max(0, cur.offsetLeft - (sc.clientWidth - cur.offsetWidth) / 2);
      });
    }

    // ------------------------------------------------------------------ next step and stage completion
    function banner2(cls, iconName, title, text) {
      const c = el('section', 'oxi-card2 next ' + cls); c.setAttribute('aria-labelledby', 'nsT');
      const row = el('div', 'oxi-state'); const ic = el('span', 'oxi-state-ic'); ic.appendChild(icon(iconName, 22));
      const t = el('div'); const h = el('h2', null, title); h.id = 'nsT'; t.append(h, el('p', null, text)); row.append(ic, t); c.appendChild(row); return c;
    }
    /** One checklist item. Ticking an item that needs a result opens a "What was found?" box first; the tick is only saved with the result. */
    function checklistItem(ci, stageNo) {
      const url = '/api/rd/projects/' + pid + '/stages/' + stageNo + '/checklist/' + ci.id;
      const li = el('li', 'oxi-ci'); const lab = el('label'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = ci.done; cb.disabled = !D.can.edit;
      lab.append(cb, document.createTextNode(' ' + ci.label)); li.appendChild(lab);
      const canWrite = D.can.edit && D.can.technical;
      const hasStored = !!ci.result || ci.result_hidden;
      let formBox = null;

      function closeForm(revert) { if (formBox) { formBox.remove(); formBox = null; } if (revert) cb.checked = ci.done; cb.disabled = !D.can.edit; }
      function openForm() {
        if (formBox) { formBox.querySelector('textarea').focus(); return; }
        cb.disabled = true;
        formBox = el('form', 'oxi-resultform'); formBox.noValidate = true;
        const id = 'res' + ci.id; const l = el('label', null, 'What was found? ' + ci.label); l.htmlFor = id;
        const ta = el('textarea'); ta.id = id; ta.rows = 3; ta.maxLength = 2000; ta.value = ci.result || '';
        const hint = el('div', 'oxi-section-note', 'Saved under your name with the date. Only people with R&D technical access can read it. Up to 2000 characters.'); hint.style.margin = '2px 0 6px';
        const err = el('div', 'oxi-errtext'); err.hidden = true; err.setAttribute('role', 'alert');
        // a result written by someone doing part of this item can be used here, then edited
        const fromTasks = D.tasks.filter(t => t.checklist_item_id === ci.id && t.status === 'done' && t.result);
        let useBox = null;
        if (fromTasks.length) {
          const sel = select(fromTasks.map(t => [t.id, (t.assignee_name || 'Task') + ': ' + t.title]), '', 'Use the result from a finished task...'); sel.setAttribute('aria-label', 'Use the result from a finished task');
          sel.onchange = () => { const t = fromTasks.find(x => String(x.id) === sel.value); if (t) { ta.value = (ta.value ? ta.value.trim() + '\n\n' : '') + t.assignee_name + ' (' + t.title + '): ' + t.result; ta.focus(); } sel.value = ''; };
          useBox = el('div'); useBox.style.margin = '0 0 6px'; useBox.appendChild(sel);
        }
        const row = el('div', 'row');
        const save = el('button', null, ci.done ? 'Save result' : 'Save and tick'); save.type = 'submit';
        const cancel = el('button', 'oxi-btn-secondary', 'Cancel'); cancel.type = 'button'; cancel.onclick = () => { closeForm(true); cb.focus(); };
        row.append(save, cancel); formBox.append(l, ta); if (useBox) formBox.appendChild(useBox); formBox.append(hint, err, row);
        ta.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeForm(true); cb.focus(); } });
        formBox.addEventListener('submit', async (ev) => {
          ev.preventDefault(); if (save.disabled) return;
          if (!ta.value.trim()) { err.textContent = 'Write what was found first.'; err.hidden = false; ta.focus(); return; }
          save.disabled = true; err.hidden = true;
          const r = await api(url, 'POST', { done: true, result: ta.value });      // the typed text stays on screen if this fails
          save.disabled = false; if (!r.success) { fail(r, err); return; }
          note('Saved.', true); load(true);
        });
        li.appendChild(formBox); ta.focus();
      }

      cb.onchange = async () => {
        if (cb.checked && ci.needs_result && !hasStored) {
          if (!canWrite) { cb.checked = false; note('Recording a result needs R&D technical access.', false); return; }
          cb.checked = false; openForm(); return;                                   // not ticked until the result is saved
        }
        cb.disabled = true;
        const r = await api(url, 'POST', { done: cb.checked });
        if (!r.success) { cb.checked = !cb.checked; cb.disabled = !D.can.edit; fail(r); return; }
        load(true);
      };

      // who ticked it and when, then the result (or why there is none to show)
      if (ci.done) li.appendChild(el('div', 'oxi-ci-meta', 'Ticked by ' + (ci.done_by_name || '-') + (ci.done_at ? ' on ' + dmy(String(ci.done_at).slice(0, 10)) : '')));
      if (ci.result) {
        const r = el('div', 'oxi-result'); r.append(el('strong', null, 'Result'), el('p', null, ci.result)); li.appendChild(r);
      } else if (ci.result_hidden) {
        li.appendChild(el('div', 'oxi-result oxi-result-hidden', 'A result has been recorded. It is confidential to R&D.'));
      } else if (ci.done && ci.needs_result) {
        li.appendChild(el('div', 'oxi-ci-meta', 'No result recorded (ticked before results were kept).'));
      }
      const linked = D.tasks.filter(t => t.checklist_item_id === ci.id && t.status !== 'cancelled');
      if (linked.length) li.appendChild(el('div', 'oxi-ci-links', 'Assigned: ' + linked.map(t => t.title + ' - ' + (t.assignee_name || '-') + ' (' + (TASK_LABEL[t.status] || t.status) + ')').join('; ')));
      if (D.can.edit && !ci.done) { const ab = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Assign'); ab.type = 'button'; ab.setAttribute('aria-label', 'Assign to someone: ' + ci.label); ab.onclick = () => assignWorkDialog(stageNo, ci.id); li.appendChild(ab); }
      if (D.can.edit && canWrite && ci.done && ci.needs_result) {
        const b = el('button', 'oxi-btn-secondary oxi-btn-sm', ci.result ? 'Edit result' : 'Add result'); b.type = 'button';
        b.setAttribute('aria-label', (ci.result ? 'Edit result: ' : 'Add result: ') + ci.label); b.onclick = () => openForm(); li.appendChild(b);
      }
      return li;
    }

    /** What the stage owner has handed to other people, how far it has got, and the review buttons. */
    function assignedWorkBlock(stageNo) {
      const stage = D.stages[stageNo - 1], w = stage.work || { total: 0, done: 0, in_review: 0, overdue: 0, people: [] };
      const box = el('section', 'oxi-work'); box.setAttribute('aria-labelledby', 'awH');
      const h = el('h3'); h.id = 'awH'; h.appendChild(document.createTextNode('Assigned work'));
      if (w.total) h.appendChild(el('span', 'roll', w.done + ' of ' + w.total + ' done' + (w.in_review ? ', ' + w.in_review + ' waiting for review' : '') + (w.overdue ? ', ' + w.overdue + ' overdue' : '') + (w.people.length ? ' - ' + w.people.join(', ') : '')));
      box.appendChild(h);
      const tasks = D.tasks.filter(t => t.stage_no === stageNo && t.status !== 'cancelled');
      if (!tasks.length) box.appendChild(el('p', 'oxi-section-note', 'Nothing assigned yet.' + (D.can.edit ? ' Hand part of this stage to someone, for example a trainee.' : '')));
      else {
        const ul = el('ul');
        tasks.forEach(t => {
          const li = el('li', t.status === 'in_review' ? 'review' : t.status === 'done' ? 'done' : isLate(t) ? 'late' : '');
          const g = el('div', 'grow'); const b = el('button', 'oxi-linkbtn', t.title); b.type = 'button'; b.onclick = () => taskPanel(t, b); g.appendChild(b);
          g.appendChild(el('small', null, [t.checklist_label ? 'for "' + t.checklist_label + '"' : null, t.assignee_name || 'Unassigned', t.due_date ? 'due ' + dmy(t.due_date) : null, TASK_LABEL[t.status] || t.status].filter(Boolean).join(' - ')));
          li.appendChild(g);
          if (canReview(t)) { const rv = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Review'); rv.type = 'button'; rv.setAttribute('aria-label', 'Review: ' + t.title); rv.onclick = () => taskPanel(t, rv); li.appendChild(rv); }
          ul.appendChild(li);
        });
        box.appendChild(ul);
      }
      if (D.can.edit) { const a = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Assign part of this stage'); a.type = 'button'; a.onclick = () => assignWorkDialog(stageNo); box.appendChild(a); }
      return box;
    }

    function nextStepCard() {
      const p = D.project;
      if (p.status === 'Completed') return banner2('ok', 'check', 'Project completed', 'This project was completed on ' + dmy(p.completed_on) + '.');
      if (p.status === 'Rejected') return banner2('bad', 'stop', 'Request rejected', 'This request was rejected. Change the status if it should be reconsidered.');
      if (p.status === 'On Hold') return banner2('warn', 'pause', 'Project on hold', 'This project is on hold (paused). Stages cannot be completed until it is resumed.');
      const c = el('section', 'oxi-card2 next'); c.setAttribute('aria-labelledby', 'nsT');
      const n = D.next_step;
      if (!n) {
        const row = el('div', 'oxi-state'); const ic = el('span', 'oxi-state-ic ok'); ic.appendChild(icon('check', 22));
        const t = el('div'); const h = el('h2', null, 'All stages complete'); h.id = 'nsT'; t.append(h, el('p', null, 'All eight stages are complete. Marking the project completed closes it.')); row.append(ic, t); c.appendChild(row);
        if (D.can.stage) { const b = el('button', null, 'Mark Project Completed'); b.type = 'button'; b.onclick = completeProjectDialog; c.appendChild(b); }

      if (n.overdue) c.classList.add('late');

      const eyebrow = el('div', 'oxi-eyebrow', 'Next step - Stage ' + n.stage + ' of ' + D.stages.length);

      // owner and planned date
      const facts = el('div', 'oxi-facts');

      if (n.owner) { const r = el('div', 'oxi-ownerrow'); r.append(avatar(n.owner.name), el('span', null, n.owner.name + (n.owner.explicit ? '' : ' (project lead)'))); own.appendChild(r); }
      else {
        const r = el('div', 'oxi-noowner'); const ic = el('span', 'ci'); ic.appendChild(icon('userplus', 16));
        const t = el('span', null, D.can.edit ? 'No owner yet - assign a project lead' : 'No owner yet - a project lead needs to be assigned'); r.append(ic, t);
        if (D.can.edit) { const bt = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Assign project lead'); bt.type = 'button'; bt.onclick = focusLead; r.appendChild(bt); }
        own.appendChild(r);
      }
      const due = el('div', 'oxi-fact'); due.appendChild(el('small', null, 'Planned date'));
      const dr = el('div', 'oxi-duerow'); dr.appendChild(icon('calendar', 16)); dr.appendChild(el('span', null, n.due ? dmy(n.due) : 'Not planned yet'));
      if (n.overdue) { const od = el('span', 'oxi-tag bad'); od.append(icon('alert', 13), document.createTextNode(' ' + plural(stage.delay, 'day') + ' overdue')); dr.appendChild(od); }
      due.appendChild(dr); facts.append(own, due); c.appendChild(facts);
      if (stage.review_flag) { const f = el('div', 'oxi-flag'); f.append(icon('alert', 15), document.createTextNode(' ' + stage.review_flag)); c.appendChild(f); }

      // checklist with a progress bar (check / uncheck behaves exactly as before)
      const doneN = n.checklist.filter(ci => ci.done).length, totalN = n.checklist.length;
      const ph = el('div', 'oxi-checkhead'); ph.append(el('strong', null, 'Checklist'), el('span', null, doneN + ' of ' + totalN + ' done'));
      c.appendChild(ph); c.appendChild(progressBar(totalN ? doneN / totalN * 100 : 0, doneN === totalN && totalN ? 'ok' : '', 'Checklist progress: ' + doneN + ' of ' + totalN + ' done'));
      const ul = el('ul', 'oxi-checklist'); ul.setAttribute('aria-label', 'Stage ' + n.stage + ' checklist');
      n.checklist.forEach(ci => ul.appendChild(checklistItem(ci, n.stage)));
      c.appendChild(ul);
      c.appendChild(assignedWorkBlock(n.stage));
      if (n.missing.length) { const m = el('div', 'oxi-missing'); m.append(document.createTextNode('Before this stage can be completed:')); const mu = el('ul'); n.missing.forEach(t => mu.appendChild(el('li', null, t))); m.appendChild(mu); c.appendChild(m); }
      if (D.can.stage) { const b = el('button', null, 'Mark stage ' + n.stage + ' done'); b.type = 'button'; b.onclick = () => completeStageDialog(stage); c.appendChild(b); }
      else c.appendChild(el('p', 'oxi-section-note', 'Completing a stage needs the stage permission and edit access to this project.'));
      return c;
    }

    function completeStageDialog(stage) {
      let dateEl;
      dialog('Complete stage ' + stage.no + ': ' + stage.name, (body) => {
        if (stage.missing.length) {
          const m = el('div', 'oxi-missing'); m.append(document.createTextNode('This stage cannot be completed yet:')); const ul = el('ul'); stage.missing.forEach(t => ul.appendChild(el('li', null, t))); m.appendChild(ul); body.appendChild(m);
        } else {
          body.appendChild(el('p', null, 'Confirm that every checklist item for this stage is done and the work is finished. The completion date is recorded with your name and cannot be in the future. Reopening it later needs a reason.'));
        }
        if (stage.no_trial_warning) body.appendChild(el('p', 'tr-warn', '⚠ No lab trial has been recorded for this stage. You can still complete it, but this will be written in the project history. Record trials on the Trials tab first if work was done.'));
        dateEl = dateInput(D.today, D.today); body.appendChild(field('Completion date', dateEl, 'cDate'));
        return () => ({ date: dateEl.value });
      }, 'Complete stage ' + stage.no, async (a, errBox) => {
        const r = await api('/api/rd/projects/' + pid + '/stages/' + stage.no + '/complete', 'POST', { date: a.date, confirm: true, stage_version: stage.version });
        if (!r.success) { if (r.missing) errBox.textContent = r.error + ': ' + r.missing.join('; '); else fail(r, errBox); errBox.hidden = false; if (r.already) load(true); return false; }
        note('Stage ' + stage.no + ' completed.', true); load(true); return true;

    }

    function reopenDialog(stage) {

        pl = dateInput(stage.planned); pl.disabled = stage.state === 'done';
        body.appendChild(field('Planned date', pl, 'sPlan', stage.state === 'done' ? 'A completed stage keeps its planned date.' : 'Dates are calendar days. Leave empty to plan it later.'));
        ow = select(personOptions(), stage.owner && stage.owner.explicit ? stage.owner.id : '', 'Project lead' + (D.lead ? ' (' + D.lead.name + ')' : ''));
        body.appendChild(field('Stage owner', ow, 'sOwner', 'Without a named owner the project lead is responsible.'));
        rm = el('textarea'); rm.rows = 3; rm.value = stage.remarks || ''; body.appendChild(field('Remarks', rm, 'sRem'));

    // ------------------------------------------------------------------ scheduling previews

          const boxes = [];

          if (!x.success) { fail(x, errBox); return false; }
          note('Schedule updated.', true); load(true); return true;
        } : null, { cancelLabel: changed.length ? 'Cancel' : 'Close' });

    }

      const rows = D.stages.map(s => {
        const end = s.actual || s.planned; if (!end) return { s, start: null, end: null };
        const start = new Date(ms(end) - Math.max(0, (s.days || 1) - 1) * day).toISOString().slice(0, 10);
        return { s, start, end };
      });
      const dated = rows.filter(r => r.end), tdated = D.tasks.filter(t => t.due_date && t.status !== 'done');
      const c = el('section', 'oxi-card2'); c.setAttribute('aria-labelledby', 'tlT'); const h = el('h2', null, 'Timeline'); h.id = 'tlT'; c.appendChild(h);
      if (!dated.length && !tdated.length) { c.appendChild(el('p', null, 'No planned dates yet. Plan the stages from the Overview tab to see them here.')); box.appendChild(c); return; }

      const min = Math.min(...all.map(ms)) - 3 * day, max = Math.max(...all.map(ms)) + 3 * day, span = Math.max(day, max - min);
      const pct = (iso) => ((ms(iso) - min) / span * 100);
      const g = el('div', 'oxi-gantt'); g.setAttribute('role', 'table'); g.setAttribute('aria-label', 'Stage timeline');
      // month scale
      const scale = el('div', 'scale'); const first = new Date(min); first.setUTCDate(1);
      for (let d = new Date(first); d.getTime() <= max; d.setUTCMonth(d.getUTCMonth() + 1)) { const x = (d.getTime() - min) / span * 100; if (x < 0) continue; const m = el('span', null, d.toLocaleString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' })); m.style.left = x + '%'; scale.appendChild(m); }
      g.appendChild(el('div', 'lane head')); g.lastChild.append(el('div', 'lbl'), scale);
      const lineAt = (iso, cls, label) => { const l = el('i', 'vline ' + cls); l.style.left = pct(iso) + '%'; l.title = label; return l; };
      const addLane = (label, track) => { const lane = el('div', 'lane'); lane.setAttribute('role', 'row'); const lb = el('div', 'lbl', label); lb.setAttribute('role', 'rowheader'); const tr = el('div', 'track'); tr.setAttribute('role', 'cell'); track(tr); tr.appendChild(lineAt(D.today, 'today', 'Today')); lane.append(lb, tr); g.appendChild(lane); };
      rows.forEach(({ s, start, end }) => addLane(s.no + '. ' + s.name, (tr) => {

        b.style.left = pct(start) + '%'; b.style.width = Math.max(1.2, pct(end) - pct(start) + 100 / (span / day)) + '%';

        b.title = txt; b.setAttribute('aria-label', 'Stage ' + s.no + ' ' + txt); tr.appendChild(b);
      }));
      if (tdated.length) addLane('Open tasks (due dates)', (tr) => tdated.forEach(t => { const m = el('span', 'mark' + (t.due_date < D.today ? ' late' : '')); m.style.left = pct(t.due_date) + '%'; m.title = t.title + ' - due ' + dmy(t.due_date); m.setAttribute('aria-label', m.title); tr.appendChild(m); }));

    const RES_SYM = { 'Pass': '✓', 'Fail': '✕', 'Not tested': '–' };
    const rupeesPerKg = (v) => '₹ ' + Number(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' /kg';
    const trialErrors = (r) => (r && r.errors && r.errors.length ? r.errors.map(e => e.message).join(' ') : null);
    function trialFail(r, box) { fail(r, box); const m = trialErrors(r); if (m && box) { box.textContent = m; box.hidden = false; } }

    async function loadTrials() {

      if (!r.success) { const b = $('trialsview'); b.innerHTML = ''; const e = el('div', 'oxi-error-state'); e.setAttribute('role', 'alert'); e.appendChild(el('p', null, r.error || 'Could not load the trials.')); const t = el('button', null, 'Try again'); t.type = 'button'; t.onclick = loadTrials; e.appendChild(t); b.appendChild(e); return; }

    /** One stacked bar per trial (pass / fail / not tested), so improvement from trial to trial is visible. Numbers are printed on the bars. */
    function trialChart(trials) {
      const total = T.requirements.length, n = trials.length;
      const bw = 44, gap = 18, left = 34, top = 18, h = 130, w = Math.max(280, left + n * (bw + gap) + gap);
      const svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + (top + h + 40), width: w, height: top + h + 40, class: 'tr-chart', role: 'img' });
      svg.setAttribute('aria-label', 'Requirements passed in each trial: ' + trials.map(t => t.label + ' ' + t.summary.pass + ' of ' + total).join(', '));
      [0, 0.5, 1].forEach(f => { const y = top + h - f * h; svg.appendChild(svgEl('line', { x1: left - 4, x2: w - 6, y1: y, y2: y, class: 'tr-grid' })); const tx = svgEl('text', { x: left - 8, y: y + 4, 'text-anchor': 'end', class: 'tr-axis' }); tx.textContent = Math.round(f * total); svg.appendChild(tx); });
      trials.forEach((t, i) => {
        const x = left + gap + i * (bw + gap); let y = top + h;
        [['pass', t.summary.pass], ['fail', t.summary.fail], ['none', t.summary.not_tested]].forEach(([k, v]) => {
          if (!v || !total) return; const hh = v / total * h; y -= hh;
          const r = svgEl('rect', { x, y, width: bw, height: hh, class: 'tr-' + k, rx: 3 }); const ti = svgEl('title'); ti.textContent = t.label + ': ' + v + (k === 'pass' ? ' pass' : k === 'fail' ? ' fail' : ' not tested'); r.appendChild(ti); svg.appendChild(r);
          if (hh >= 16) { const tx = svgEl('text', { x: x + bw / 2, y: y + hh / 2 + 4, 'text-anchor': 'middle', class: 'tr-num' + (k === 'none' ? ' dark' : '') }); tx.textContent = v; svg.appendChild(tx); }
        });
        const lb = svgEl('text', { x: x + bw / 2, y: top + h + 16, 'text-anchor': 'middle', class: 'tr-axis' }); lb.textContent = t.label; svg.appendChild(lb);
        if (t.outcome === 'Preferred formula') { const st = svgEl('text', { x: x + bw / 2, y: top + h + 32, 'text-anchor': 'middle', class: 'tr-star' }); st.textContent = '★ preferred'; svg.appendChild(st); }
      });
      return svg;
    }

      return l;
    }
    /** Rows = requirements, columns = trials. Each cell says Pass, Fail or Not tested in words (for screen readers) and with a symbol, as well as colour. */

      const t = el('table', 'tr-grid-table oxi-nocards'); const cap = el('caption', 'oxi-sr-only', 'Result of each trial against each performance requirement'); t.appendChild(cap);
      const hr = el('tr'); hr.appendChild(Object.assign(el('th', null, 'Requirement'), { scope: 'col' })); trials.forEach(x => hr.appendChild(Object.assign(el('th', null, x.label), { scope: 'col' })));

        trials.forEach(x => {
          const r = x.results.find(y => y.requirement_id === q.id), res = r ? r.result : 'Not tested';
          const td = el('td', 'tr-cell tr-c-' + res.replace(' ', '').toLowerCase()); td.appendChild(el('span', null, RES_SYM[res])); td.appendChild(el('span', 'oxi-sr-only', ' ' + res));
          td.title = x.label + ' / ' + (q.parameter || 'requirement') + ': ' + res + (r && r.measured_value ? ' (' + r.measured_value + ')' : ''); tr.appendChild(td);

    function renderTrials() {
      const box = $('trialsview'); box.innerHTML = '';
      const trials = T.trials;
      const head = el('div', 'tr-head'); head.appendChild(el('h2', null, 'Lab trials'));
      let addBtn = null;
      if (T.can.add) { addBtn = el('button', null, 'Add trial'); addBtn.type = 'button'; addBtn.onclick = () => trialDialog(null); head.appendChild(addBtn); }
      box.appendChild(head);
      box.appendChild(el('p', 'oxi-section-note', 'Each trial records what was tried and how it did against every performance requirement. Trials are never deleted: a mistake is fixed with a correction that keeps the earlier values. Attachments not available yet.'));
      if (!T.can.technical) box.appendChild(el('p', 'oxi-section-note', 'The formula, what changed, observations and measured values are confidential and are not shown to you.'));

        if (T.can.add) { const b = el('button', null, 'Add trial'); b.type = 'button'; b.onclick = () => trialDialog(null); c.appendChild(b); }
        box.appendChild(c); return;
      }
      const pref = trials.find(t => t.outcome === 'Preferred formula');
      if (pref) box.appendChild(el('p', 'tr-pref', '★ Preferred formula so far: ' + pref.label + (T.can.technical && pref.formula_ref ? ' (' + pref.formula_ref + ')' : '') + '. Marking a trial as preferred only records the outcome; it does not complete a stage or record an approval.'));

      const cc = el('section', 'oxi-card2'); cc.setAttribute('aria-labelledby', 'trChartT'); const ch = el('h3', null, 'Requirements passed, trial by trial'); ch.id = 'trChartT'; cc.appendChild(ch);
      if (!T.requirements.length) cc.appendChild(el('p', 'oxi-section-note', 'This project has no performance requirements, so there is nothing to compare.'));
      else {
        const sc = el('div', 'tr-chartbox'); sc.tabIndex = 0; sc.setAttribute('role', 'region'); sc.setAttribute('aria-label', 'Chart of requirements passed in each trial'); sc.appendChild(trialChart(trials)); cc.appendChild(sc); cc.appendChild(trialLegend());
        const dl = el('details'); dl.appendChild(el('summary', null, 'The same numbers as a list'));
        const ul = el('ul'); trials.forEach(t => ul.appendChild(el('li', null, t.label + ' (' + dmy(t.trial_date) + '): ' + t.summary.pass + ' of ' + t.summary.total + ' pass, ' + t.summary.fail + ' fail, ' + t.summary.not_tested + ' not tested. Outcome: ' + t.outcome + '.'))); dl.appendChild(ul); cc.appendChild(dl);
        const gh = el('h3', null, 'Each requirement in each trial'); gh.style.marginTop = '14px'; cc.appendChild(gh); cc.appendChild(trialGrid(trials));
      }
      box.appendChild(cc);

      const wrap = el('div', 'oxi-table-scroll'); wrap.tabIndex = 0; wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', 'Trials');
      const t = el('table'); t.appendChild(el('caption', 'oxi-sr-only', 'Lab trials'));
      const cols = ['Trial', 'Date', 'Recorded by', 'What changed', 'Outcome', 'Passes']; if (T.can.prices) cols.push('Cost'); cols.push('');
      const hr = el('tr'); cols.forEach(c => { const th = el('th', null, c); th.scope = 'col'; if (!c) th.appendChild(el('span', 'oxi-sr-only', 'Actions')); hr.appendChild(th); }); const thd = el('thead'); thd.appendChild(hr); t.appendChild(thd);
      const tb = el('tbody');
      trials.slice().reverse().forEach(x => {
        const tr = el('tr'); tr.appendChild(el('td', null, x.label + ' (stage ' + x.stage_no + ')')); tr.appendChild(el('td', null, dmy(x.trial_date))); tr.appendChild(el('td', null, x.recorded_by_name));
        const ch2 = el('td', null, T.can.technical ? (x.changed_variables || 'Nothing recorded') : 'Confidential'); if (!T.can.technical) ch2.style.color = 'var(--text-2)'; tr.appendChild(ch2);
        const oc = el('td'); oc.appendChild(el('span', OUT_BADGE[x.outcome] || 'badge', x.outcome)); tr.appendChild(oc);
        tr.appendChild(el('td', null, x.summary.total ? x.summary.pass + ' of ' + x.summary.total + ' pass' : 'No requirements'));
        if (T.can.prices) tr.appendChild(el('td', null, x.rm_cost_per_kg == null ? '-' : rupeesPerKg(x.rm_cost_per_kg)));
        const ac = el('td'); const ob = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Open'); ob.type = 'button'; ob.setAttribute('aria-label', 'Open trial ' + x.label); ob.onclick = () => trialDetail(x.id); ac.appendChild(ob); tr.appendChild(ac);
        tb.appendChild(tr);
      });
      t.appendChild(tb); wrap.appendChild(t); box.appendChild(wrap);
    }


    // ---- extra fields and attachments for a trial ----
    const kb = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
    /** Photographs are shrunk in the browser first (longest side 1800 px, JPEG), so a phone photo uploads quickly and stays under the 5 MB limit. */
    async function prepareFile(file) {
      const limit = T.limits.attach_max_bytes;
      if (file.type === 'application/pdf') { if (file.size > limit) throw new Error(file.name + ' is larger than ' + kb(limit)); return { blob: file, name: file.name }; }
      if (!/^image\/(jpeg|png)$/.test(file.type)) throw new Error(file.name + ' is not a JPEG, PNG or PDF');
      let blob = file, name = file.name;
      const bmp = await createImageBitmap(file).catch(() => null);
      if (bmp && (Math.max(bmp.width, bmp.height) > 1800 || file.size > 1.5 * 1048576)) {
        const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height)), cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
        const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85)); if (out) { blob = out; name = name.replace(/\.[a-z0-9]+$/i, '') + '.jpg'; }
      }
      if (blob.size > limit) throw new Error(file.name + ' is still larger than ' + kb(limit) + ' after shrinking');
      return { blob, name };
    }
    async function uploadTrialFile(trialId, file) {
      const f = await prepareFile(file);
      const res = await fetch('/api/rd/projects/' + pid + '/trials/' + trialId + '/attachments', { method: 'POST', headers: { 'Content-Type': f.blob.type, 'X-File-Name': encodeURIComponent(f.name) }, body: f.blob });
      const r = await res.json().catch(() => ({})); if (!res.ok || !r.success) throw new Error(r.error || 'Could not save ' + file.name);
      return r;
    }
    const FILE_ACCEPT = 'image/jpeg,image/png,application/pdf';

    /** The editable list of extra fields: name, value, Remove; plus "Add a field". Returns { box, read }. */
    function extraFieldsEditor(initial) {
      const box = el('div', 'tr-extra'), rows = [], list = el('div'); const max = T.limits.max_extra_fields;
      const add = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Add a field'); add.type = 'button';
      const sync = () => { add.disabled = rows.length >= max; add.textContent = rows.length >= max ? 'Field limit reached (' + max + ')' : 'Add a field'; };
      const addRow = (label, value, focus) => {
        const r = {}; const w = el('div', 'tr-extra-row');
        r.l = el('input'); r.l.type = 'text'; r.l.maxLength = 60; r.l.value = label || ''; r.l.setAttribute('aria-label', 'Field name'); r.l.placeholder = 'Field name, e.g. Pot life';
        r.v = el('input'); r.v.type = 'text'; r.v.maxLength = 300; r.v.value = value || ''; r.v.setAttribute('aria-label', 'Value' + (label ? ' of ' + label : '')); r.v.placeholder = 'Value';
        r.l.addEventListener('input', () => r.v.setAttribute('aria-label', 'Value' + (r.l.value ? ' of ' + r.l.value : '')));
        const rm = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Remove'); rm.type = 'button'; rm.setAttribute('aria-label', 'Remove this field');
        rm.onclick = () => { const i = rows.indexOf(r); rows.splice(i, 1); w.remove(); sync(); (rows[Math.min(i, rows.length - 1)] ? rows[Math.min(i, rows.length - 1)].l : add).focus(); };
        w.append(r.l, r.v, rm); list.appendChild(w); rows.push(r); sync(); if (focus) r.l.focus();
      };
      (initial || []).forEach(f => addRow(f.label, f.value));
      add.onclick = () => addRow('', '', true);
      box.append(list, add);
      return { box, read: () => rows.map(r => ({ label: r.l.value, value: r.v.value })) };
    }

    /** Photographs and PDFs of the trial's results: thumbnails, open, remove (with a reason), add. Confidential: only for people with technical access. */
    function attachmentsBlock(x) {
      const box = el('section'); box.setAttribute('aria-label', 'Photographs and files'); box.appendChild(el('h4', null, 'Photographs and files'));
      if (!T.can.technical) { box.appendChild(el('p', 'oxi-section-note', x.attachment_count ? x.attachment_count + ' file' + (x.attachment_count === 1 ? '' : 's') + ' attached. They are confidential and not shown to you.' : 'No files attached.')); return box; }
      const urls = []; const dlgOf = () => box.closest('dialog'); const stop = () => { const d = dlgOf(); if (d) d.addEventListener('close', () => urls.forEach(u => URL.revokeObjectURL(u)), { once: true }); };
      const msg = el('div', 'oxi-errtext'); msg.setAttribute('role', 'alert'); msg.hidden = true;
      const grid = el('ul', 'tr-files');
      if (!x.attachments.length) box.appendChild(el('p', 'oxi-section-note', 'No photographs or files yet.'));
      x.attachments.forEach(a => {
        const li = el('li', 'tr-file'); const th = el('div', 'tr-thumb'); th.textContent = a.mime === 'application/pdf' ? 'PDF' : '…';
        const info = el('div', 'tr-fileinfo'); info.appendChild(el('strong', null, a.file_name)); info.appendChild(el('small', null, kb(a.size_bytes) + ' · ' + a.by + ' · ' + dmy(String(a.at).slice(0, 10))));
        const get = async () => { const res = await fetch('/api/rd/projects/' + pid + '/trials/' + x.id + '/attachments/' + a.id); if (!res.ok) throw new Error('Could not load the file'); const u = URL.createObjectURL(await res.blob()); urls.push(u); return u; };
        if (a.mime !== 'application/pdf') get().then(u => { const im = el('img'); im.src = u; im.alt = 'Photograph ' + a.file_name; th.textContent = ''; th.appendChild(im); }).catch(() => { th.textContent = '!'; });
        const act = el('div', 'tr-fileact');
        const open = el('button', 'oxi-btn-secondary oxi-btn-sm', a.mime === 'application/pdf' ? 'Download' : 'View'); open.type = 'button'; open.setAttribute('aria-label', (a.mime === 'application/pdf' ? 'Download ' : 'View ') + a.file_name);
        open.onclick = async () => { try { const u = await get(); if (a.mime === 'application/pdf') { const l = document.createElement('a'); l.href = u; l.download = a.file_name; l.click(); } else window.open(u, '_blank', 'noopener'); } catch (e) { msg.textContent = e.message; msg.hidden = false; } };
        act.appendChild(open);
        if (T.can.add) {
          const rm = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Remove'); rm.type = 'button'; rm.setAttribute('aria-label', 'Remove ' + a.file_name);
          rm.onclick = () => { const d = dlgOf(); d.close(); setTimeout(() => dialog('Remove ' + a.file_name, (b) => { const ta = el('textarea'); ta.rows = 2; ta.maxLength = 1000; b.appendChild(el('p', 'oxi-section-note', 'The file is kept in the history; it stops being shown. Say why it is being removed.')); b.appendChild(field('Reason (required)', ta, 'rmWhy')); return () => ({ reason: ta.value }); }, 'Remove file', async (v, err) => {
            const r = await api('/api/rd/projects/' + pid + '/trials/' + x.id + '/attachments/' + a.id + '/remove', 'POST', { reason: v.reason }); if (!r.success) { err.textContent = r.error || 'Could not remove it.'; err.hidden = false; return false; }
            await loadTrials(); setTimeout(() => trialDetail(x.id), 0); return true; }), 0); };
          act.appendChild(rm);
        }
        li.append(th, info, act); grid.appendChild(li);
      });
      box.appendChild(grid);
      if (T.can.add) {
        const inp = el('input'); inp.type = 'file'; inp.accept = FILE_ACCEPT; inp.multiple = true; inp.id = 'trFiles' + x.id; inp.className = 'oxi-sr-only';
        const lab = el('label', 'tr-filebtn', 'Add photographs or files'); lab.htmlFor = inp.id; lab.tabIndex = 0; lab.setAttribute('role', 'button');
        lab.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
        box.append(lab, inp, el('p', 'oxi-section-note', 'JPEG, PNG or PDF, up to ' + kb(T.limits.attach_max_bytes) + ' each and ' + T.limits.attach_max_per_trial + ' per trial. Photographs are shrunk before they are sent.'));
        inp.onchange = async () => {
          const files = [...inp.files]; if (!files.length) return; msg.hidden = true; lab.textContent = 'Uploading…'; const bad = [];
          for (const f of files) { try { await uploadTrialFile(x.id, f); } catch (e) { bad.push(e.message); } }
          await loadTrials();
          if (bad.length) note(bad.join(' '), false); else note('Saved.', true);
          const d = dlgOf(); if (d) d.close(); setTimeout(() => trialDetail(x.id), 0);
        };
      }
      box.appendChild(msg); stop(); setTimeout(stop, 0); return box;
    }

    function trialDetail(id) {
      const x = T.trials.find(y => y.id === id); if (!x) return;
      dialog('Trial ' + x.label, (body) => {
        const dl = el('dl', 'tr-dl');
        const row = (k, v) => { if (v == null || v === '') return; dl.appendChild(el('dt', null, k)); const dd = el('dd'); if (v instanceof Node) dd.appendChild(v); else dd.textContent = v; dl.appendChild(dd); };
        row('Stage', x.stage_no + ': ' + STAGE_NAMES[x.stage_no]); row('Date', dmy(x.trial_date)); row('Recorded by', x.recorded_by_name);
        row('Outcome', Object.assign(el('span', OUT_BADGE[x.outcome] || 'badge', x.outcome)));
        if (T.can.technical) { row('Formula or version', x.formula_ref); row('What changed', x.changed_variables || 'Nothing recorded'); } else row('Formula, what changed, observations', 'Confidential: not shown to you');
        row('Batch size', x.batch_size_text); if (T.can.technical) row('Observations', x.observations);
        if (T.can.technical) (x.extra_fields || []).forEach(f => row(f.label, f.value || '-'));
        if (T.can.prices) row('Raw-material cost', x.rm_cost_per_kg == null ? 'Not recorded' : rupeesPerKg(x.rm_cost_per_kg));
        body.appendChild(dl);
        const rt = el('table', 'oxi-nocards'); const rh = el('tr'); ['Requirement', 'Result'].concat(T.can.technical ? ['Measured'] : []).forEach(c => { const th = el('th', null, c); th.scope = 'col'; rh.appendChild(th); }); const th0 = el('thead'); th0.appendChild(rh); rt.appendChild(th0);
        const rb = el('tbody'); T.requirements.forEach(q => { const r = x.results.find(y => y.requirement_id === q.id) || { result: 'Not tested' }; const tr = el('tr'); tr.appendChild(el('td', null, (q.parameter || '(unnamed)') + (q.target ? ' (target ' + q.target + ')' : ''))); const td = el('td'); td.appendChild(el('span', 'tr-res tr-c-' + r.result.replace(' ', '').toLowerCase(), RES_SYM[r.result] + ' ' + r.result)); tr.appendChild(td); if (T.can.technical) tr.appendChild(el('td', null, r.measured_value || '')); rb.appendChild(tr); });
        rt.appendChild(rb); const rw = el('div', 'oxi-table-scroll'); rw.appendChild(rt); body.appendChild(rw);
        body.appendChild(attachmentsBlock(x));
        body.appendChild(el('h4', null, 'Corrections'));
        if (!x.corrections.length) body.appendChild(el('p', 'oxi-section-note', 'This trial has not been corrected.'));
        else { const ul = el('ul', 'tr-corr'); x.corrections.slice().reverse().forEach(c => { const li = el('li'); li.appendChild(el('strong', null, dmy(String(c.at).slice(0, 10)) + ', ' + c.by + ': ' + (c.fields.length ? 'changed ' + c.fields.map(f => f.replace(/_/g, ' ')).join(', ') : 'corrected'))); if (c.reason) li.appendChild(el('div', null, 'Reason: ' + c.reason)); if (c.old) { const old = Object.entries(c.old).filter(([k]) => k !== 'results').map(([k, v]) => k.replace(/_/g, ' ') + ' was "' + (v == null ? '' : v) + '"'); if (c.old.results) old.push('results were changed'); if (old.length) li.appendChild(el('div', 'oxi-section-note', 'Before: ' + old.join('; '))); } ul.appendChild(li); }); body.appendChild(ul); }
        if (T.can.add) { const cb = el('button', 'oxi-btn-secondary', 'Correct this trial'); cb.type = 'button'; cb.onclick = () => { body.closest('dialog').close(); setTimeout(() => trialDialog(x), 0); }; body.appendChild(cb); }
        return null;
      }, '', null, { cancelLabel: 'Close' });
    }

    /** The add form (existing = null) and the correction form (existing = a trial). Typed text stays when a save fails. */
    function trialDialog(existing) {
      const x = existing, today = D.today;
      dialog(x ? 'Correct trial ' + x.label : 'Add a lab trial', (body) => {
        const f = {};
        const row = el('div', 'tr-two');
        f.date = dateInput(x ? x.trial_date : today, today); f.date.required = true;
        f.stage = select([[2, '2: First Lab Batch'], [3, '3: Lab Trials & Optimisation']], x ? x.stage_no : (D.current_stage_no === 2 ? 2 : 3));
        row.append(field('Trial date', f.date, 'trDate'), field('Stage', f.stage, 'trStage')); body.appendChild(row);
        f.formula = el('input'); f.formula.type = 'text'; f.formula.maxLength = 200; f.formula.value = x ? (x.formula_ref || '') : '';
        body.appendChild(field('Formula or version used (required)', f.formula, 'trFormula', 'For example the formula number and version. Confidential.'));
        f.changed = el('input'); f.changed.type = 'text'; f.changed.maxLength = 500; f.changed.value = x ? (x.changed_variables || '') : '';
        body.appendChild(field('What changed from the previous trial', f.changed, 'trChanged', 'For example "solvent 40% to 35%". Leave empty for the first trial.'));
        f.batch = el('input'); f.batch.type = 'text'; f.batch.maxLength = 100; f.batch.value = x ? (x.batch_size_text || '') : ''; body.appendChild(field('Batch size', f.batch, 'trBatch'));
        f.obs = el('textarea'); f.obs.rows = 3; f.obs.maxLength = 3000; f.obs.value = x ? (x.observations || '') : ''; body.appendChild(field('Observations', f.obs, 'trObs', 'For example viscosity, solids, appearance.'));
        body.appendChild(el('h4', null, 'Extra fields'));
        body.appendChild(el('p', 'oxi-section-note', 'Add anything else worth recording for this trial, for example "Pot life" or "Colour match". Names are copied from the last trial so you do not retype them: change a value, rename or remove a field as needed.'));
        const prevTrial = T.trials.length ? T.trials[T.trials.length - 1] : null;
        f.extra = extraFieldsEditor(x ? (x.extra_fields || []) : ((prevTrial && prevTrial.extra_fields) || []).map(e => ({ label: e.label, value: '' }))); body.appendChild(f.extra.box);
        body.appendChild(el('h4', null, 'Results against each requirement'));
        f.res = {};
        if (!T.requirements.length) body.appendChild(el('p', 'oxi-section-note', 'This project has no performance requirements.'));
        T.requirements.forEach((q, i) => {
          const cur = x && x.results.find(r => r.requirement_id === q.id);
          const rw = el('div', 'tr-res-row'); const nm = el('div', 'tr-res-name'); nm.appendChild(el('strong', null, q.parameter || '(unnamed)')); if (q.target || q.acceptable_range) nm.appendChild(el('small', null, [q.target && 'Target: ' + q.target, q.acceptable_range && 'Range: ' + q.acceptable_range].filter(Boolean).join(' · ')));
          const sel = select(T.results, cur ? cur.result : 'Not tested'); const mv = el('input'); mv.type = 'text'; mv.maxLength = 200; mv.value = cur && cur.measured_value ? cur.measured_value : '';
          rw.append(nm, field('Result', sel, 'trRes' + i), field('Measured value', mv, 'trMv' + i)); body.appendChild(rw); f.res[q.id] = { sel, mv };
        });
        f.outcome = select(T.outcomes, x ? x.outcome : 'Needs another trial');
        body.appendChild(field('Outcome', f.outcome, 'trOutcome'));
        const hint = el('p', 'oxi-section-note', 'Preferred formula only records the outcome. It does not complete a stage, tick a checklist item or record an approval. If another trial was preferred, it is set back to "Needs another trial" with a note.'); hint.hidden = f.outcome.value !== 'Preferred formula'; body.appendChild(hint);
        f.outcome.onchange = () => { hint.hidden = f.outcome.value !== 'Preferred formula'; };
        if (T.can.prices) { f.cost = el('input'); f.cost.type = 'text'; f.cost.inputMode = 'decimal'; f.cost.value = x && x.rm_cost_per_kg != null ? String(x.rm_cost_per_kg) : ''; body.appendChild(field('Raw-material cost per kg (₹, optional)', f.cost, 'trCost', 'Up to two decimals.')); }
        if (!x) {
          const fi = el('input'); fi.type = 'file'; fi.accept = FILE_ACCEPT; fi.multiple = true; f.files = fi;
          body.appendChild(field('Photographs or files of the results (optional)', fi, 'trNewFiles', 'JPEG, PNG or PDF, up to ' + kb(T.limits.attach_max_bytes) + ' each. They are added right after the trial is saved. More can be added later from the trial.'));
        }
        if (x) { f.reason = el('textarea'); f.reason.rows = 2; f.reason.maxLength = 1000; body.appendChild(field('Reason for the correction (required)', f.reason, 'trReason', 'The earlier values are kept in the correction history.')); }
        return () => f;
      }, x ? 'Save correction' : 'Save trial', async (f, err) => {
        const payload = { trial_date: f.date.value, stage_no: Number(f.stage.value), formula_ref: f.formula.value, changed_variables: f.changed.value, batch_size_text: f.batch.value, observations: f.obs.value, extra_fields: f.extra.read(), outcome: f.outcome.value,
          results: T.requirements.map(q => ({ requirement_id: q.id, result: f.res[q.id].sel.value, measured_value: f.res[q.id].mv.value })) };
        if (f.cost) payload.rm_cost_per_kg = f.cost.value;
        let r;
        if (x) {
          if (!f.reason.value.trim()) { err.textContent = 'Say why you are correcting this trial.'; err.hidden = false; f.reason.focus(); return false; }
          payload.reason = f.reason.value; payload.version = x.version;
          r = await api('/api/rd/projects/' + pid + '/trials/' + x.id, 'PATCH', payload);
        } else r = await api('/api/rd/projects/' + pid + '/trials', 'POST', payload);
        if (!r.success) { trialFail(r, err); return false; }
        let bad = [];
        if (!x && f.files && f.files.files.length) { for (const file of [...f.files.files]) { try { await uploadTrialFile(r.id, file); } catch (e) { bad.push(e.message); } } }
        if (bad.length) note('Trial ' + r.label + ' recorded, but some files could not be added: ' + bad.join(' ') + ' Open the trial to add them again.', false);
        else note(x ? 'Correction saved. The earlier values are kept in the history.' : 'Trial ' + r.label + ' recorded.', true);
        await loadTrials();
        // the lists were redrawn, so give focus back to the matching control in the new page content
        lastFocus = x ? $('trialsview').querySelector('button[aria-label="Open trial ' + x.label + '"]') : $('trialsview').querySelector('.tr-head button');
        return true;
      });
    }

    // ------------------------------------------------------------------ tabs and loading
    const BASE_TABS = ['overview', 'list', 'board', 'timeline', 'activity'];
    let TABS = BASE_TABS.slice();                       // the Trials tab is added only for people who may see trials
    function setTab(name, focus) {
      document.querySelectorAll('[role=tab]').forEach(t => { const on = t.dataset.tab === name; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; if (on && focus) t.focus(); });
      TABS.forEach(n => { $('panel-' + n).hidden = n !== name; });
      history.replaceState(null, '', location.pathname + location.search + (name === 'overview' ? '' : '#' + name));
    }
    document.querySelectorAll('[role=tab]').forEach(t => {
      t.addEventListener('click', () => setTab(t.dataset.tab));
      t.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        const i = TABS.indexOf(t.dataset.tab); setTab(TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length], true); e.preventDefault();
      });
    });
    window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && D) setTab(h); });
    window.addEventListener('beforeunload', (e) => { if (dirtyAssess) { e.preventDefault(); e.returnValue = ''; } });

    async function load(quiet) {
      if (!pid) { note('No project selected.', false); return; }
      const d = await api('/api/rd/projects/' + pid);
      if (!d.success) {
        $('overview').setAttribute('aria-busy', 'false'); $('overview').innerHTML = '';
        const e = el('div', 'oxi-error-state'); e.setAttribute('role', 'alert'); e.appendChild(el('p', null, d.error || 'Could not load this project.'));
        const b = el('button', null, 'Try again'); b.type = 'button'; b.onclick = () => load(); e.appendChild(b); $('overview').appendChild(e); return;
      }
      if (d.project.is_draft) { location.replace('project-new.html?id=' + pid); return; }
      D = d; D.me_id = (() => { try { return JSON.parse(localStorage.getItem('oxicol_user')).id; } catch (e) { return null; } })();
      if (!meta) { meta = await api('/api/rd/meta'); if (!meta.success) { note(meta.error, false); return; } }
      if (D.can.edit && !people.length) { const p = await api('/api/rd/people?project=' + pid); if (p.success) people = p.people; }
      TABS = D.can.trial_view ? BASE_TABS.concat('trials') : BASE_TABS.slice(); $('tab-trials').hidden = !D.can.trial_view;
      renderHeader(); renderOverview(); renderList(); renderBoard(); renderTimeline(); renderActivity();
      if (D.can.trial_view) loadTrials();
      $('banner').hidden = true;
    }

    const sp = new URLSearchParams(location.search);
    if (sp.get('submitted') !== null) note('Request submitted' + (sp.get('submitted') ? ' as ' + sp.get('submitted') : '') + '. R&D can now assess it.', true);
    load().then(() => { const h = location.hash.slice(1); if (TABS.includes(h)) setTab(h); }).catch(() => note('Could not reach the server.', false));
  </script>
