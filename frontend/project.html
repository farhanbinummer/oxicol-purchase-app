<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R&amp;D Project</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#142235">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <p><a href="index.html">Home</a> &rsaquo; <a href="projects.html">R&amp;D Projects</a></p>
  <h1 id="pageTitle">Project</h1>
  <p id="message" role="status"></p>
  <div id="banner" class="oxi-banner" role="alert" hidden></div>
  <div id="meta" class="oxi-pmeta"></div>
  <section class="oxi-prog" aria-labelledby="progHead">
    <h2 class="oxi-prog-head" id="progHead"></h2>
    <div class="oxi-steps-scroll" id="stepsScroll" role="region" aria-label="Development stages" tabindex="0"><ol class="oxi-steps" id="stagebar"></ol></div>
  </section>

  <div class="oxi-tabs" role="tablist" aria-label="Project views">
    <button type="button" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" data-tab="overview">Overview</button>
    <button type="button" role="tab" id="tab-list" aria-controls="panel-list" aria-selected="false" data-tab="list" tabindex="-1">List</button>
    <button type="button" role="tab" id="tab-board" aria-controls="panel-board" aria-selected="false" data-tab="board" tabindex="-1">Board</button>
    <button type="button" role="tab" id="tab-timeline" aria-controls="panel-timeline" aria-selected="false" data-tab="timeline" tabindex="-1">Timeline</button>
    <button type="button" role="tab" id="tab-activity" aria-controls="panel-activity" aria-selected="false" data-tab="activity" tabindex="-1">Activity</button>
  </div>

  <div id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"><div id="overview" aria-busy="true"></div></div>
  <div id="panel-list" role="tabpanel" aria-labelledby="tab-list" hidden><div id="listview"></div></div>
  <div id="panel-board" role="tabpanel" aria-labelledby="tab-board" hidden><div id="boardview"></div></div>
  <div id="panel-timeline" role="tabpanel" aria-labelledby="tab-timeline" hidden><div id="timelineview"></div></div>
  <div id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" hidden><div id="activityview"></div></div>

  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const pid = Number(new URLSearchParams(location.search).get('id'));
    let D = null, meta = null, people = [], dirtyAssess = false, lastFocus = null;

    const TASK_STATUS = [['todo', 'To do'], ['in_progress', 'In progress'], ['blocked', 'Blocked'], ['done', 'Done']];
    const APPROVAL_ROWS = ['rd_head', 'management', 'qc_signoff', 'customer', 'handover_ack'];
    const DECISION_TEXT = { approved: 'Approved', rejected: 'Rejected', returned: 'Returned for more information', submitted: 'Submitted' };

    // ------------------------------------------------------------------ helpers
    function note(text, ok) { const m = $('message'); m.textContent = text; m.className = ok ? 'success' : 'error'; if (!ok) m.scrollIntoView({ block: 'nearest' }); }
    function banner(text, reload) {
      const b = $('banner'); b.innerHTML = ''; b.appendChild(document.createTextNode(text));
      if (reload) { const r = el('button', null, 'Reload the project'); r.type = 'button'; r.onclick = () => { b.hidden = true; load(); }; b.appendChild(r); }
      b.hidden = false;
    }
    /** Shows an API failure where the person is looking: inside the open dialog, otherwise on the page. */
    function fail(r, box) {
      const text = (r && r.error) || 'That did not work.';
      const stale = r && r.current_version !== undefined && !r.cooldown;
      if (box) { box.textContent = text; box.hidden = false; }
      else note(text, false);
      if (stale) banner('This project was changed by someone else. Reload to see their changes before trying again.', true);
    }
    function field(label, ctl, id, hint) {
      const w = el('div'); const l = el('label', null, label); ctl.id = id; l.htmlFor = id; w.append(l, ctl);
      if (hint) { const h = el('div', 'oxi-section-note', hint); h.style.margin = '2px 0 0'; w.appendChild(h); }
      return w;
    }
    function select(options, value, blank) {
      const s = el('select');
      if (blank != null) { const o = el('option', null, blank); o.value = ''; s.appendChild(o); }
      options.forEach(x => { const [v, t] = Array.isArray(x) ? x : [x, x]; const o = el('option', null, t); o.value = v; s.appendChild(o); });
      s.value = value == null ? '' : String(value); return s;
    }
    const personOptions = () => people.map(p => [p.id, p.name]);
    function dateInput(value, max) { const i = el('input'); i.type = 'date'; i.value = value || ''; if (max) i.max = max; return i; }


    // ------------------------------------------------------------------ presentation helpers (inline SVG and CSS only)
    const SVGNS = 'http://www.w3.org/2000/svg';
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ICON = {
      check: 'M5 13l4 4L19 7', alert: 'M12 9v4m0 4h.01M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
      clock: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z', user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      userplus: 'M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M19 8v6M16 11h6', calendar: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      flag: 'M5 21V4M5 4h12l-2 4 2 4H5', tag: 'M3 12V4h8l10 10-8 8zM7.5 8.5h.01', pause: 'M8 5v14M16 5v14', tasks: 'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01',
      stop: 'M5.6 5.6l12.8 12.8M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z'
    };
    function svgEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v)); return e; }
    function icon(name, size) { const s = svgEl('svg', { viewBox: '0 0 24 24', width: size || 16, height: size || 16, fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', focusable: 'false' }); s.appendChild(svgEl('path', { d: ICON[name] || ICON.flag })); return s; }
    const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
    const avatar = (name) => el('span', 'oxi-avatar', initials(name));
    /** A small pill: icon, a quiet label and the value. children are appended after the label. */
    function chip(iconName, label, ...value) {
      const c = el('span', 'oxi-chip'); const ic = el('span', 'ci'); ic.appendChild(icon(iconName, 14)); c.appendChild(ic);
      const t = el('span'); t.append(el('small', null, label + ' '), ...value.map(v => typeof v === 'string' ? document.createTextNode(v) : v)); c.appendChild(t); return c;
    }
    /** Donut ring. segs = [{ value, color }] (a CSS colour or token); the centre shows big and small text. The svg is described by `label`. */
    function ringChart(segs, total, opt) {
      const size = opt.size || 112, sw = opt.stroke || 12, r = (size - sw) / 2, C = 2 * Math.PI * r;
      const svg = svgEl('svg', { viewBox: '0 0 ' + size + ' ' + size, width: size, height: size, role: 'img', 'aria-label': opt.label, class: 'oxi-ring' });
      svg.appendChild(svgEl('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--border)', 'stroke-width': sw }));
      let acc = 0; const live = [];
      segs.filter(g => g.value > 0 && total > 0).forEach(g => {
        const len = g.value / total * C;
        const c = svgEl('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: g.color, 'stroke-width': sw, 'stroke-dasharray': (REDUCED ? len : 0) + ' ' + C, 'stroke-dashoffset': -acc, transform: 'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')', class: 'seg' });
        svg.appendChild(c); live.push([c, len, C]); acc += len;
      });
      if (!REDUCED) requestAnimationFrame(() => requestAnimationFrame(() => live.forEach(([c, len, CC]) => c.setAttribute('stroke-dasharray', len + ' ' + CC))));
      const big = svgEl('text', { x: size / 2, y: size / 2 + (opt.small ? 2 : 7), 'text-anchor': 'middle', class: 'ring-big' }); big.textContent = opt.big; svg.appendChild(big);
      if (opt.small) { const sm = svgEl('text', { x: size / 2, y: size / 2 + 20, 'text-anchor': 'middle', class: 'ring-small' }); sm.textContent = opt.small; svg.appendChild(sm); }
      return svg;
    }
    /** Horizontal stacked bar. segs = [{ value, cls }]; `label` is the text alternative. */
    function stackBar(segs, label) {
      const total = segs.reduce((a, g) => a + g.value, 0); const b = el('div', 'oxi-stack'); b.setAttribute('role', 'img'); b.setAttribute('aria-label', label);
      segs.filter(g => g.value > 0).forEach(g => { const i = el('i', g.cls); i.style.flexGrow = String(g.value); b.appendChild(i); });
      if (!total) b.classList.add('empty'); return b;
    }
    /** Determinate progress bar. */
    function progressBar(pct, cls, label) {
      const b = el('div', 'oxi-meter' + (cls ? ' ' + cls : '')); b.setAttribute('role', 'progressbar'); b.setAttribute('aria-valuemin', '0'); b.setAttribute('aria-valuemax', '100'); b.setAttribute('aria-valuenow', String(Math.round(pct))); b.setAttribute('aria-label', label);
      const i = el('i'); i.style.width = (REDUCED ? Math.round(pct) : 0) + '%'; b.appendChild(i);
      if (!REDUCED) requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = Math.round(pct) + '%'; })); return b;
    }
    const shortStage = (name) => String(name).split(/ \/ | & /)[0];
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    function focusLead() { const f = $('aLead'); if (f) { f.scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' }); f.focus({ preventScroll: true }); } }

    /** A modal dialog. build(body) fills it and returns a function that reads the answers; onOk(answers, errBox, okButton) must return true to close. */
    function dialog(title, build, okLabel, onOk, opts) {
      lastFocus = document.activeElement;
      const dlg = el('dialog', 'oxi-dlg'); dlg.setAttribute('aria-labelledby', 'dlgTitle');
      const form = el('form'); form.method = 'dialog';
      const h = el('h3', null, title); h.id = 'dlgTitle';
      const body = el('div'); const err = el('div', 'oxi-errtext'); err.setAttribute('role', 'alert'); err.hidden = true;
      const read = build(body, err);
      const row = el('div', 'row');
      const cancel = el('button', 'oxi-btn-secondary', opts && opts.cancelLabel || 'Cancel'); cancel.type = 'button'; cancel.onclick = () => dlg.close();
      const ok = el('button', null, okLabel); ok.type = 'submit';
      if (opts && opts.disableOk) ok.disabled = true;
      row.append(cancel); if (onOk) row.append(ok);
      form.append(h, body, err, row); dlg.appendChild(form); document.body.appendChild(dlg);
      let working = false;
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (working || !onOk) return;
        working = true; ok.disabled = true; err.hidden = true;           // a second click while the request is out does nothing
        let close = false;
        try { close = await onOk(read ? read() : {}, err, ok); } catch (e) { err.textContent = 'Could not reach the server.'; err.hidden = false; }
        working = false; if (!close) ok.disabled = !!(opts && opts.disableOk && opts.stayDisabled && opts.stayDisabled());
        if (close) dlg.close();
      });
      dlg.addEventListener('close', () => { dlg.remove(); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); });
      dlg.showModal();
      const first = dlg.querySelector('input:not([type=hidden]),select,textarea'); if (first) first.focus(); else cancel.focus();
      return dlg;
    }

    // ------------------------------------------------------------------ header and stage tracker
    function renderHeader() {
      const p = D.project;
      $('pageTitle').textContent = p.project_number + ' ' + p.title;
      document.title = p.project_number + ' - R&D Project';
      const m = $('meta'); m.innerHTML = '';
      m.className = 'oxi-chips';
      // status and priority keep their badges; everything else is a labelled chip with an icon
      const sp = el('span', 'oxi-chip plain'); sp.append(rdBadge(p.status), prioBadge(p.priority)); m.appendChild(sp);
      if (p.status === 'On Hold') { const h = el('span', 'oxi-chip warn'); const ic = el('span', 'ci'); ic.appendChild(icon('pause', 14)); h.append(ic, el('span', null, 'Paused: no stage can be completed until work resumes.')); m.appendChild(h); }
      m.appendChild(chip('user', 'Lead', D.lead ? D.lead.name : 'Not assigned'));
      m.appendChild(chip('flag', 'Target launch', p.target_tbc ? 'To be confirmed' : (p.target_launch_date ? dmy(p.target_launch_date) : '-')));
      m.appendChild(chip('calendar', 'Requested by', (p.requested_by_name || '-') + (p.request_date ? ' on ' + dmy(p.request_date) : '')));
      if (p.project_type) m.appendChild(chip('tag', 'Type', p.project_type));
      const fav = el('button', 'oxi-fav'); fav.type = 'button'; fav.textContent = D.favourite ? '★' : '☆'; fav.setAttribute('aria-pressed', String(D.favourite));
      fav.setAttribute('aria-label', D.favourite ? 'Remove from favourites' : 'Add to favourites');
      fav.onclick = async () => { fav.disabled = true; const r = await api('/api/rd/projects/' + pid + '/favourite', 'PUT', { favourite: !D.favourite }); fav.disabled = false; if (r.success) { D.favourite = r.favourite; renderHeader(); } else fail(r); };
      m.appendChild(fav);
      if (D.can.edit) { const e = el('a', 'oxi-btn oxi-btn-secondary', 'Edit request'); e.href = 'project-new.html?id=' + pid; m.appendChild(e); }
      if (D.can.edit) { const sb = el('button', 'oxi-btn-secondary', 'Change status'); sb.type = 'button'; sb.onclick = statusDialog; m.appendChild(sb); }
      renderStepper();
    }

    /** One connected stepper: tick when complete, pulsing ring for the current stage, amber warning when it needs review. */
    function renderStepper() {
      const done = D.stages.filter(s => s.state === 'done').length, total = D.stages.length, pct = Math.round(done / total * 100);
      const head = $('progHead'); head.innerHTML = '';
      head.append(document.createTextNode(done === total ? 'All ' + total + ' stages complete' : 'Stage ' + (D.current_stage_no || done + 1) + ' of ' + total), el('span', 'pct', '- ' + pct + '% complete'));
      const bar = $('stagebar'); bar.innerHTML = '';
      D.stages.forEach(s => {
        const review = !!s.review_flag;
        const cls = [s.state === 'done' ? 'done' : '', s.state === 'current' ? 'cur' : '', s.state === 'current' && s.overdue ? 'late' : '', review ? 'rev' : ''].filter(Boolean).join(' ');
        const li = el('li', cls);
        const dot = el('span', 'dot'); dot.appendChild(review ? icon('alert', 18) : s.state === 'done' ? icon('check', 18) : document.createTextNode(String(s.no)));
        const status = review ? 'Needs review' : s.state === 'done' ? 'Done ' + dmy(s.actual) : s.overdue ? 'Overdue ' + plural(s.delay, 'day') : s.state === 'current' ? 'Current' : 'Not started';
        li.append(dot, el('span', 'nm', shortStage(s.name)), el('span', 'st', status));
        if (s.planned && s.state !== 'done') li.appendChild(el('span', 'pl', 'Planned ' + dmy(s.planned)));
        li.title = s.name;
        li.setAttribute('aria-label', 'Stage ' + s.no + ', ' + s.name + ': ' + status + (s.planned && s.state !== 'done' ? ', planned ' + dmy(s.planned) : '') + (s.review_flag && s.state === 'done' ? ', done ' + dmy(s.actual) : ''));
        if (s.state === 'current') li.setAttribute('aria-current', 'step');
        bar.appendChild(li);
      });
      // a scroll container is only a tab stop when it really scrolls; bring the current stage into view inside it
      const sc = $('stepsScroll'); requestAnimationFrame(() => {
        const over = sc.scrollWidth > sc.clientWidth + 1;
        if (over) sc.setAttribute('tabindex', '0'); else sc.removeAttribute('tabindex');
        const cur = bar.querySelector('li.cur'); if (over && cur) sc.scrollLeft = Math.max(0, cur.offsetLeft - (sc.clientWidth - cur.offsetWidth) / 2);
      });
    }

    // ------------------------------------------------------------------ next step and stage completion
    function banner2(cls, iconName, title, text) {
      const c = el('section', 'oxi-card2 next ' + cls); c.setAttribute('aria-labelledby', 'nsT');
      const row = el('div', 'oxi-state'); const ic = el('span', 'oxi-state-ic'); ic.appendChild(icon(iconName, 22));
      const t = el('div'); const h = el('h2', null, title); h.id = 'nsT'; t.append(h, el('p', null, text)); row.append(ic, t); c.appendChild(row); return c;
    }
    function nextStepCard() {
      const p = D.project;
      if (p.status === 'Completed') return banner2('ok', 'check', 'Project completed', 'This project was completed on ' + dmy(p.completed_on) + '.');
      if (p.status === 'Rejected') return banner2('bad', 'stop', 'Request rejected', 'This request was rejected. Change the status if it should be reconsidered.');
      if (p.status === 'On Hold') return banner2('warn', 'pause', 'Project on hold', 'This project is on hold (paused). Stages cannot be completed until it is resumed.');
      const c = el('section', 'oxi-card2 next'); c.setAttribute('aria-labelledby', 'nsT');
      const n = D.next_step;
      if (!n) {
        const row = el('div', 'oxi-state'); const ic = el('span', 'oxi-state-ic ok'); ic.appendChild(icon('check', 22));
        const t = el('div'); const h = el('h2', null, 'All stages complete'); h.id = 'nsT'; t.append(h, el('p', null, 'All eight stages are complete. Marking the project completed closes it.')); row.append(ic, t); c.appendChild(row);
        if (D.can.stage) { const b = el('button', null, 'Mark Project Completed'); b.type = 'button'; b.onclick = completeProjectDialog; c.appendChild(b); }
        return c;
      }
      if (n.overdue) c.classList.add('late');
      const stage = D.stages[n.stage - 1];
      const eyebrow = el('div', 'oxi-eyebrow', 'Next step - Stage ' + n.stage + ' of ' + D.stages.length);
      const h = el('h2', null, n.name); h.id = 'nsT'; c.append(eyebrow, h);

      // owner and planned date
      const facts = el('div', 'oxi-facts');
      const own = el('div', 'oxi-fact'); own.appendChild(el('small', null, 'Owner'));
      if (n.owner) { const r = el('div', 'oxi-ownerrow'); r.append(avatar(n.owner.name), el('span', null, n.owner.name + (n.owner.explicit ? '' : ' (project lead)'))); own.appendChild(r); }
      else {
        const r = el('div', 'oxi-noowner'); const ic = el('span', 'ci'); ic.appendChild(icon('userplus', 16));
        const t = el('span', null, D.can.edit ? 'No owner yet - assign a project lead' : 'No owner yet - a project lead needs to be assigned'); r.append(ic, t);
        if (D.can.edit) { const bt = el('button', 'oxi-btn-secondary oxi-btn-sm', 'Assign project lead'); bt.type = 'button'; bt.onclick = focusLead; r.appendChild(bt); }
        own.appendChild(r);
      }
      const due = el('div', 'oxi-fact'); due.appendChild(el('small', null, 'Planned date'));
      const dr = el('div', 'oxi-duerow'); dr.appendChild(icon('calendar', 16)); dr.appendChild(el('span', null, n.due ? dmy(n.due) : 'Not planned yet'));
      if (n.overdue) { const od = el('span', 'oxi-tag bad'); od.append(icon('alert', 13), document.createTextNode(' ' + plural(stage.delay, 'day') + ' overdue')); dr.appendChild(od); }
      due.appendChild(dr); facts.append(own, due); c.appendChild(facts);
      if (stage.review_flag) { const f = el('div', 'oxi-flag'); f.append(icon('alert', 15), document.createTextNode(' ' + stage.review_flag)); c.appendChild(f); }

      // checklist with a progress bar (check / uncheck behaves exactly as before)
      const doneN = n.checklist.filter(ci => ci.done).length, totalN = n.checklist.length;
      const ph = el('div', 'oxi-checkhead'); ph.append(el('strong', null, 'Checklist'), el('span', null, doneN + ' of ' + totalN + ' done'));
      c.appendChild(ph); c.appendChild(progressBar(totalN ? doneN / totalN * 100 : 0, doneN === totalN && totalN ? 'ok' : '', 'Checklist progress: ' + doneN + ' of ' + totalN + ' done'));
      const ul = el('ul', 'oxi-checklist'); ul.setAttribute('aria-label', 'Stage ' + n.stage + ' checklist');
      n.checklist.forEach(ci => {
        const li = el('li'); const lab = el('label'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = ci.done; cb.disabled = !D.can.edit;
        cb.onchange = async () => {
          cb.disabled = true;
          const r = await api('/api/rd/projects/' + pid + '/stages/' + n.stage + '/checklist/' + ci.id, 'POST', { done: cb.checked });
          if (!r.success) { cb.checked = !cb.checked; cb.disabled = !D.can.edit; fail(r); return; }
          load(true);
        };
        lab.append(cb, document.createTextNode(' ' + ci.label)); li.appendChild(lab); ul.appendChild(li);
      });
      c.appendChild(ul);
      if (n.missing.length) { const m = el('div', 'oxi-missing'); m.append(document.createTextNode('Before this stage can be completed:')); const mu = el('ul'); n.missing.forEach(t => mu.appendChild(el('li', null, t))); m.appendChild(mu); c.appendChild(m); }
      if (D.can.stage) { const b = el('button', null, 'Mark stage ' + n.stage + ' done'); b.type = 'button'; b.onclick = () => completeStageDialog(stage); c.appendChild(b); }
      else c.appendChild(el('p', 'oxi-section-note', 'Completing a stage needs the stage permission and edit access to this project.'));
      return c;
    }

    function completeStageDialog(stage) {
      let dateEl;
      dialog('Complete stage ' + stage.no + ': ' + stage.name, (body) => {
        if (stage.missing.length) {
          const m = el('div', 'oxi-missing'); m.append(document.createTextNode('This stage cannot be completed yet:')); const ul = el('ul'); stage.missing.forEach(t => ul.appendChild(el('li', null, t))); m.appendChild(ul); body.appendChild(m);
        } else {
          body.appendChild(el('p', null, 'Confirm that every checklist item for this stage is done and the work is finished. The completion date is recorded with your name and cannot be in the future. Reopening it later needs a reason.'));
        }
        dateEl = dateInput(D.today, D.today); body.appendChild(field('Completion date', dateEl, 'cDate'));
        return () => ({ date: dateEl.value });
      }, 'Complete stage ' + stage.no, async (a, errBox) => {
        const r = await api('/api/rd/projects/' + pid + '/stages/' + stage.no + '/complete', 'POST', { date: a.date, confirm: true, stage_version: stage.version });
        if (!r.success) { if (r.missing) errBox.textContent = r.error + ': ' + r.missing.join('; '); else fail(r, errBox); errBox.hidden = false; if (r.already) load(true); return false; }
        note('Stage ' + stage.no + ' completed.', true); load(true); return true;
      }, { disableOk: stage.missing.length > 0, stayDisabled: () => stage.missing.length > 0 });
    }

    function completeProjectDialog() {
      let dEl;
      dialog('Mark project completed', (body) => {
        body.appendChild(el('p', null, 'All eight stages are done. This closes the project. Completing a project does not release any formula to production: that needs the handover acknowledgement and an authorised release.'));
        dEl = dateInput(D.today, D.today); body.appendChild(field('Completion date', dEl, 'pcDate'));
        return () => ({ date: dEl.value });
      }, 'Mark completed', async (a, errBox) => {

      });
      c.appendChild(chips);
      const items = D.updates.filter(u => actFilter === 'all' || u.kind === actFilter);
      const feed = el('ul', 'oxi-feed');
      if (!items.length) feed.appendChild(el('li', null, 'Nothing to show.'));
      items.forEach(u => {
        const li = el('li'); const kind = u.kind === 'lab_note' ? ' - lab note' : u.kind === 'system' ? ' - change' : '';
        li.append(el('span', 'who', u.author_name || (u.kind === 'system' ? 'System' : '-')), el('span', 'when', timeAgo(u.at) + kind), el('p', u.kind === 'system' ? 'k-system' : null, u.body)); feed.appendChild(li);
      });
      c.appendChild(feed);
      c.appendChild(el('p', 'oxi-section-note', 'To add a comment or lab note, use "Discussion and lab updates" on the Overview tab. Showing the latest 100 entries.'));
      box.appendChild(c);
    }

    // ------------------------------------------------------------------ tabs and loading
    const TABS = ['overview', 'list', 'board', 'timeline', 'activity'];
    function setTab(name, focus) {
      document.querySelectorAll('[role=tab]').forEach(t => { const on = t.dataset.tab === name; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; if (on && focus) t.focus(); });
      TABS.forEach(n => { $('panel-' + n).hidden = n !== name; });
      history.replaceState(null, '', location.pathname + location.search + (name === 'overview' ? '' : '#' + name));
    }
    document.querySelectorAll('[role=tab]').forEach(t => {
      t.addEventListener('click', () => setTab(t.dataset.tab));
      t.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        const i = TABS.indexOf(t.dataset.tab); setTab(TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length], true); e.preventDefault();
      });
    });
    window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && D) setTab(h); });
    window.addEventListener('beforeunload', (e) => { if (dirtyAssess) { e.preventDefault(); e.returnValue = ''; } });

    async function load(quiet) {
      if (!pid) { note('No project selected.', false); return; }
      const d = await api('/api/rd/projects/' + pid);
      if (!d.success) {
        $('overview').setAttribute('aria-busy', 'false'); $('overview').innerHTML = '';
        const e = el('div', 'oxi-error-state'); e.setAttribute('role', 'alert'); e.appendChild(el('p', null, d.error || 'Could not load this project.'));
        const b = el('button', null, 'Try again'); b.type = 'button'; b.onclick = () => load(); e.appendChild(b); $('overview').appendChild(e); return;
      }
      if (d.project.is_draft) { location.replace('project-new.html?id=' + pid); return; }
      D = d; D.me_id = (() => { try { return JSON.parse(localStorage.getItem('oxicol_user')).id; } catch (e) { return null; } })();
      if (!meta) { meta = await api('/api/rd/meta'); if (!meta.success) { note(meta.error, false); return; } }
      if (D.can.edit && !people.length) { const p = await api('/api/rd/people?project=' + pid); if (p.success) people = p.people; }
      renderHeader(); renderOverview(); renderList(); renderBoard(); renderTimeline(); renderActivity();
      $('banner').hidden = true;
    }

    const sp = new URLSearchParams(location.search);
    if (sp.get('submitted') !== null) note('Request submitted' + (sp.get('submitted') ? ' as ' + sp.get('submitted') : '') + '. R&D can now assess it.', true);
    load().then(() => { const h = location.hash.slice(1); if (TABS.includes(h)) setTab(h); }).catch(() => note('Could not reach the server.', false));
  </script>
</body>
</html>
